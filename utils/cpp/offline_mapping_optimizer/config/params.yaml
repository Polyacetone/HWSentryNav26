/**:
  ros__parameters:
    # Global
    data_path: "mapping_2026-01-21T20:50:43"
    num_threads: 16

    # Factor graph optimization
    enable_factor_graph_optimization: false
    max_iterations: 100
    outer_iterations: 3
    min_frame_points: 100
    k_neighbors: 10
    gicp_max_correspondence_distance: 0.1

    # Overlap-gated global-map optimization
    # Global map is voxelized, and each frame only adds a registration factor when overlap is high.
    map_voxel_resolution: 0.1

    # Optional: also add overlap-gated frame-frame GICP factors
    enable_pairwise_factors: true
    loop_dist_thres: 3.0
    pairwise_voxel_resolution: 0.1
    pairwise_overlap_threshold: 0.5
    # Limit loop closures per frame (0 = unlimited)
    max_loops_per_frame: 0

    # Raycasting filter
    enable_raycasting_filter: true
    # If built with -DMAP_OPTIMIZER_USE_CUDA=ON, enables CUDA raycasting.
    # If CUDA is not compiled in, the node will fall back to CPU automatically.
    use_cuda_raycasting: true
    voxel_resolution: 0.02
    pass_through_threshold: 2

    # Downsample
    enable_downsample: true
    downsample_leaf_size: 0.05

    # Remove radius outliers
    enable_radius_outlier_removal: true
    radius_search: 0.5
    min_neighbors_in_radius: 2

    # Remove statistical outliers
    enable_statistical_outlier_removal: false
    mean_k: 10
    std_dev_mul_thresh: 3.0

    # MLS smoothing
    enable_mls_smoothing: false
    search_radius: 0.2
    polynomial_order: 1