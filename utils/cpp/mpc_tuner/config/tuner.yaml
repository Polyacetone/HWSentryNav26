tuner:
  study:
    seed: 2026 # 随机数种子，用于复现实验结果
    population_size: 64 # 每代评估的候选参数组数量（≈3.5× 参数维度）
    elite_fraction: 0.20 # 用于更新采样分布的最优候选比例
    generations: 10 # CEM 优化迭代代数
    initial_std: 0.45 # 归一化参数空间的初始采样标准差
    min_std: 0.03 # 归一化参数空间的最小采样标准差
    parallel_workers: 20 # 并行评估候选参数的工作线程数，0 表示使用全部逻辑核心
    progress_interval_seconds: 10.0 # 优化过程中打印进度日志的时间间隔，单位秒
    regularization_lambda: 0.1 # 归一化空间向基线锚定的软正则强度；train/validation 差距大可调大
  episode:
    timeout: 30.0 # 每条场景的仿真超时时间，单位秒
    goal_radius: 0.5 # 判定到达目标的距离阈值，单位米
    target_arrival_speed: 0.5 # 软标量中期望的到达线速度，单位米每秒
    high_cost_threshold: 30.0 # 统计高代价区域停留时间的代价阈值
    lethal_cost_threshold: 250.0 # 硬门槛：处于致命代价（hazard）的判定阈值，对齐 rollout_safety
    severe_step_heading_error_deg: 15.0 # 硬门槛：台阶穿越角严重违规阈值，单位度
    severe_step_speed_margin: 0.2 # 硬门槛：超出台阶速度窗该裕量即判严重违规，单位米每秒
    forward_progress_epsilon: 0.0001 # 判定“前进”的路径参数 Δu 死区，用于 run-up 段违规门控
    # ── 软标量：特征尺度（多大算“很多”，物理/经验量）──
    soft_scales:
      reference_speed: 2.0 # 每路线时间归一的参考速度 (m/s)，t_ref = 弧长 / 该值
      arrival_speed_band: 1.0 # 超出目标到达速度部分的归一化尺度 (m/s)；越小则到达速度惩罚越强
      cross_track: 0.3 # 横向偏离归一尺度 (m)，取管廊半宽 y_tube
      high_cost_integral: 1.0 # 经过代价积分软膝盖尺度
      accel_floor: 2.0 # 平滑度地板：线加速度阈值 (m/s²)，取 acc_max
      alpha_floor: 7.2 # 平滑度地板：角加速度阈值 (rad/s²)，取 alpha_max
    # ── 软标量：偏好权重（多在乎该项，价值取舍）。时间为唯一主导项 ──
    soft_weights:
      time: 1.0 # 通行时间（主导）
      high_cost: 0.30 # 经过代价（靠近障碍但未致命）
      arrival_speed: 0.25 # 到达剩余速度
      step_speed_minor: 0.60 # 台阶速度轻微违规
      step_heading_minor: 0.60 # 台阶穿越角轻微违规
      cross_track: 0.10 # 横向偏离
      smoothness: 0.10 # 平滑度地板（超物理加速度的抖动）
  # 搜索空间：仅列出需要覆盖描述表默认区间的参数；未列出者回退到 parameter_space.hpp 的默认区间。
  # y_tube 之外均为对数采样。
  search_space:
    q_y: [0.08, 3.00] # 横向跟踪误差权重
    q_theta: [0.04, 0.80] # 航向跟踪误差权重
    q_u: [0.25, 4.00] # 路径进度跟踪权重
    y_tube: [0.10, 0.50] # 横向误差管束宽度（线性采样，米）
    q_term_prog: [0.05, 1.50] # 终端路径进度权重
    q_term_lateral: [0.05, 1.50] # 终端横向误差权重
    r_v: [0.002, 0.10] # 线速度指令幅值惩罚
    r_omega: [0.002, 0.10] # 角速度指令幅值惩罚
    r_dv: [0.03, 3.00] # 线速度指令变化惩罚
    r_domega: [0.02, 0.80] # 角速度指令变化惩罚
    environment_obstacle: [1.0, 25.0] # 避障代价权重
    step_direction: [0.5, 12.0] # 台阶穿越方向对齐权重
    step_velocity_window: [0.4, 10.0] # 台阶速度窗权重
    step_reachability_lo: [0.15, 4.0] # 助跑达速下限势权重
    step_reachability_hi: [0.15, 4.0] # 助跑超速上限势权重
    q_v_final: [0.04, 1.0] # 终端减速权重
    motion_penalty_scale: [0.3, 3.0] # 指令可行性惩罚共享乘子（加速度/角加速度/侧向）
    step_smoothness_scale: [0.3, 3.0] # 台阶内部平滑惩罚共享乘子（角速度/线加速/角加速）
