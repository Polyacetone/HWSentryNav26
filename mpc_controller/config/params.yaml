/**:
  ros__parameters:
    # ─── Topic 配置 ───
    local_plan_sub_topic: "/local_planner/local_plan"
    global_cost_map_sub_topic: "/map_server/global_cost_map"
    local_cost_map_sub_topic: "/map_server/local_cost_map"
    direction_map_sub_topic: "/map_server/global_direction_map"
    chassis_status_sub_topic: "/serial_bridge/chassis_status"
    comp_stage_sub_topic: "/serial_bridge/comp_stage"
    chassis_cmd_pub_topic: "/mpc_controller/chassis_cmd"

    debug:
      enable: true
      predicted_path_pub_topic: "/mpc_controller/debug/predicted_path"
      v_pred_pub_topic: "/mpc_controller/debug/v_pred"
      w_pred_pub_topic: "/mpc_controller/debug/w_pred"

    misc:
      remaining_energy_filter_alpha: 0.5

    mpc:
      energy:
        enable: false
        threshold: 500.0
        weight: 5.0
        softplus_beta: 5.0
      multi_hypothesis:
        enable: false
        keep_steps: 3
        lateral_offset: 0.8
      follow_path:
        projection:
          num_samples: 50
          search_window: 0.1
          local_search_lazy_distance: 0.1
        limits:
          vel_max: 1.8
          vel_min: 0.1
          omega_max: 7.2
          omega_min: -7.2
          start_vel_cmd_act_diff_max: 1.5
          start_omega_cmd_act_diff_max: 3.0
          acc_max: 1.5
          alpha_max: 7.0
          vel_step_up: 1.0
          vel_step_down: 1.0
          a_lat_max: 2.5
          slow_down_deceleration: 1.5
          slow_down_target_vel: 0.3
          slow_down_num_samples: 12
        weights:
          q_y: 0.6
          q_theta: 0.3
          q_u: 1.0
          q_v_final: 0.4
          r_v: 0.01
          r_omega: 0.01
          r_dv: 0.8
          r_domega: 0.2
          acc_limit: 10.0
          alpha_limit: 10.0
          lat_acc: 10.0
          vel_on_step: 0.0
          obstacle: 3.0
          direction: 3.0
      stop:
        limits:
          vel_max: 1.8
          omega_max: 12.5
          omega_min: -12.5
          start_vel_cmd_act_diff_max: 1.5
          start_omega_cmd_act_diff_max: 3.0
          acc_max: 1.5
          alpha_max: 7.0
          vel_step_up: 1.0
          vel_step_down: 1.0
          a_lat_max: 2.5
        weights:
          q_v: 0.6
          q_omega: 0.6
          r_dv: 0.8
          r_domega: 0.2
          acc_limit: 10.0
          alpha_limit: 10.0
          lat_acc: 10.0
          vel_on_step: 6.0
          obstacle: 6.0
          obstacle_terminal: 10.0
          direction: 3.0
          step_terminal: 10.0
      recovery:
        limits:
          vel_max: 0.6
          vel_min: -0.6
          omega_max: 1.2
          omega_min: -1.2
          start_vel_cmd_act_diff_max: 1.5
          start_omega_cmd_act_diff_max: 3.0
          acc_max: 1.5
          alpha_max: 7.0
          a_lat_max: 2.5
        weights:
          q_goal_xy: 0.2
          q_goal_theta: 0.1
          r_v: 0.02
          r_omega: 0.08
          r_dv: 0.8
          r_domega: 0.2
          acc_limit: 10.0
          alpha_limit: 10.0
          lat_acc: 10.0
          obstacle: 6.0
          step: 6.0
          q_goal_xy_terminal: 3.0
          obstacle_terminal: 12.0
          step_terminal: 12.0
      fixed:
        limits:
          vel_max: 0.5
          vel_min: -0.5
          omega_max: 1.0
          omega_min: -1.0
          start_vel_cmd_act_diff_max: 1.5
          start_omega_cmd_act_diff_max: 3.0
          acc_max: 1.5
          alpha_max: 7.0
          a_lat_max: 2.5
        weights:
          q_goal_xy: 0.2
          q_goal_theta: 0.1
          goal_deadzone: 0.2
          r_v: 0.02
          r_omega: 0.08
          r_dv: 0.8
          r_domega: 0.2
          acc_limit: 10.0
          alpha_limit: 10.0
          lat_acc: 10.0
          obstacle: 1.0
          step: 1.0
          q_goal_xy_terminal: 3.0
          obstacle_terminal: 2.0
          step_terminal: 2.0
