/**:
  ros__parameters:
    global_direction_map_sub_topic: "/map_server/global_direction_map" # 全局方向地图订阅话题
    global_cost_map_sub_topic: "/map_server/global_cost_map" # 全局代价地图订阅话题
    local_cost_map_sub_topic: "/map_server/local_cost_map" # 局部代价地图订阅话题（用于与全局融合规划/重规划）
    goal_sub_topic: "/decision/nav_goal" # 目标点订阅话题
    chassis_status_sub_topic: "/serial_bridge/chassis_status" # 底盘状态，用于获取当前速度
    control_points_pub_topic: "/path_planner/control_points" # 优化后路径的B样条控制点发布话题
    optimized_path_pub_topic: "/path_planner/optimized_path" # 优化后路径的采样点发布话题
    occupied_threshold: 50 # 如果起点/目标点所在格子的代价值大于该阈值，则认为起点/目标点不可达
    on_step_threshold: 0.1 # 如果起点/目标点所在格子的方向场模长大于该阈值，则认为起点/目标点在台阶上不可达

    debug:
      enable: true # 是否启用调试模式
      rough_path_pub_topic: "/path_planner/debug/rough_path" # A*原始路径发布话题

    replan:
      enable: false # 是否启用定时重规划
      timer_period: 0.2 # 定时重规划的周期（单位：秒）
      local_cost_threshold: 100 # 如果局部代价地图上全局路径经过的代价值大于该阈值，则触发重规划

    start_prediction:
      enable: true # 是否启用起点预测（刹车距离 + 规划延迟）
      max_accel: 2.0 # 最大减速度(>0)，用于估计刹车距离（单位：m/s^2）
      planning_delay: 0.2 # A* + B样条期望耗时（单位：s）
      min_speed: 0.3 # 低于该速度不进行起点前推（单位：m/s）
      collision_check_step: 0.05 # 预测起点直线可达性采样间隔（单位：m）

    path_planner:
      skip_distance: 0.5 # 如果目标点距离当前点小于该值，则跳过A*并直接构造近距离B样条初值进行优化（单位：米）
      direction_weight: 6.0 # 方向代价权重
      obstacle_weight: 4.0 # 障碍物代价权重
      step_weight: 0.6 # 经过台阶惩罚（基于方向场模长）
      downsampled_waypoint_max_interval: 5 # 对规划后的轨迹进行降采样，降采样后路径点之间的最大间隔（以格子为单位）
      feasible_threshold: 100 # 超过该阈值的格子被视为不可通行

    path_optimizer:
      step_norm_threshold: 0.01 # 台阶方向场模长阈值（>=该值视为台阶区域）
      step_norm_transition: 0.05 # smoothstep 过渡宽度（避免硬阈值带来的不稳定）
      step_detection_samples_per_meter: 10.0 # 台阶扫描采样密度（物理米）
      warmup:
        obstacle_weight: 0.5 # Warmup阶段避障权重
        direction_weight: 6.0 # Warmup阶段台阶方向对齐权重
        step_weight: 0.25 # Warmup阶段台阶位置惩罚
        start_end_weight: 15.0 # Warmup阶段起终点保持权重，避免过刚性
        smoothness_weight: 0.005 # Warmup阶段小权重二阶平滑，抑制局部抖动
        samples_per_meter: 10.0 # Warmup阶段优化采样密度（物理米）
        max_iterations: 60 # Warmup阶段最大迭代次数
        max_curvature: 1.2 # Warmup阶段统一曲率上限 (1/m)
        length_penalty:
          weight: 0.06 # Warmup阶段最小化|d1|^2，缩短路径并促使u分布更均匀
        curvature:
          base_weight: 0.1 # 低曲率基础惩罚权重，抑制直道zigzag
          base_beta: 4.0 # 基础惩罚平滑斜率
          limit_weight: 15.0 # 超曲率上限惩罚权重
          limit_beta: 16.0 # 超限惩罚平滑斜率
          min_speed_epsilon: 0.05 # 曲率计算速度保护阈值 (m)
          speed_gate_threshold: 0.15 # 小速度区域下调曲率惩罚 (m)
      main:
        obstacle_weight: 0.5 # Main阶段避障权重
        direction_weight: 6.0 # Main阶段台阶方向对齐权重
        step_weight: 0.25 # Main阶段台阶位置惩罚
        start_end_weight: 15.0 # Main阶段起终点保持权重
        smoothness_weight: 0.005 # Main阶段保留更小的二阶平滑，避免与显式曲率约束打架
        samples_per_meter: 10.0 # Main阶段优化采样密度（物理米）
        max_iterations: 60 # Main阶段单轮最大迭代次数
        max_refinement_iterations: 0 # 台阶扫描-优化耦合的最大重建轮数
        near_max_curvature: 0.4 # 台阶附近曲率上限，对齐MPC侧向加速度约束 (1/m)
        far_max_curvature: 1.2 # 远离台阶时曲率上限 (1/m)
        step_extension_distance: 1.0 # 台阶检测区间前后扩展距离 (m)
        step_transition_distance: 1.0 # 近远曲率限制平滑过渡距离 (m)
        interval_iou_threshold: 0.85 # 连续两轮台阶区间IoU达到该值认为收敛
        length_penalty:
          weight: 0.06 # Main阶段最小化|d1|^2，防止过度压短导致贴障碍
        curvature:
          base_weight: 0.1 # 低曲率基础惩罚权重，抑制zigzag
          base_beta: 4.0 # 基础惩罚平滑斜率
          limit_weight: 15.0 # 超曲率上限惩罚权重
          limit_beta: 16.0 # 超限惩罚平滑斜率
          min_speed_epsilon: 0.05 # 曲率计算速度保护阈值 (m)
          speed_gate_threshold: 0.15 # 小速度区域下调曲率惩罚 (m)