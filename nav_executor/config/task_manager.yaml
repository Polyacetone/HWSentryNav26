/**:
  ros__parameters:
    task_manager:
      goal_equivalence_distance: 0.3 # goal-to-goal 去重阈值 (m)
      plan_cooldown: 0.5 # 同一 goal 失败重试冷却 (s)

      route_tracker:
        initial_search_distance: 0.5 # 新路径仅允许在起点附近建立初始进度，覆盖规划延迟但禁止跳到后段 (m)
        max_tracking_error: 2.0 # 机器人与局部投影参考点超过该距离时视为跟踪丢失 (m)
        prediction_time_limit: 0.2 # 状态掉帧后最多积分这么久的速度，防止陈旧速度推动游标跨段 (s)
        path_speed_filter_alpha: 0.4 # 前向实测路径速度一阶滤波系数
        projection_prediction_weight: 1.0 # 相对运动预测弧长创新的权重
        search_distance_backward: 0.2 # 相对预测进度向后校正的最大弧长 (m)
        search_distance_forward: 0.4 # 相对预测进度向前校正的最大弧长 (m)

      # ═══════════════════════════════════════════════
      #  RouteMonitor — 路径监控（投影连线 + 台阶阻塞）
      # ═══════════════════════════════════════════════
      route_monitor:
        proj_guard:
          cost_max: 240.0 # 投影连线最大障碍物代价 > 该值则取消 follow (0~255)
          cost_samples: 20 # 连线代价估计采样数
        step_block: # 台阶样本固定按原始格点 direction magnitude > 0.95 的物理本体判定
          enable: true # 是否启用"台阶被动态障碍物堵住"检测并触发全局重规划
          lookahead_distance: 5.0 # 沿当前全局路径向前检查距离 (m)
          sample_resolution: 0.2 # 路径积分分辨率上限；非预测模式会进一步限制到方向地图分辨率的一半
          obstacle_cost_threshold: 100.0 # 动态障碍物代价值 >= 该值视为被障碍物占据
          predicted_obstacle_ratio_threshold: 0.8 # 预测地图模式下，台阶样本中被占据比例超过该阈值则触发重规划
        performance:
          lookahead_distance: 6.0 # 性能下降时检查尚未进入 prepare 阶段的跨越段
