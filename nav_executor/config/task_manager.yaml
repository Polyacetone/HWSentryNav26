/**:
  ros__parameters:
    task_manager:
      goal_equivalence_distance: 0.3 # goal-to-goal 去重阈值 (m)
      plan_cooldown: 0.5 # 同一 goal 失败重试冷却 (s)

      route_tracker: # 统一 (s, nu) 有向路径状态估计器：位置和速度矢量为观测，规划速度为弱先验。
        initial_search_distance: 0.5 # 新路径仅允许在起点附近建立初始进度，覆盖规划延迟但禁止跳到后段 (m)
        max_tracking_error: 2.0 # 机器人与有向参考点超过该距离时视为跟踪丢失 (m)
        prediction_time_limit: 0.2 # 状态掉帧后最多积分这么久的路径速度 (s)
        hypothesis_spacing: 0.05 # 有向进度候选的弧长间距 (m)
        max_hypotheses: 6 # 同时保留的竞争分支上限
        hypothesis_prune_ratio: 3.0 # 代价超过领先假设该比例裕度的分支被淘汰
        position_sigma: 0.20 # 位置观测标准差 (m)
        velocity_sigma: 0.30 # 地图系速度矢量观测标准差 (m/s)
        progress_sigma: 0.15 # 梯形积分进度模型标准差 (m)
        profile_speed_sigma: 0.80 # 规划速度弱先验标准差 (m/s)
        speed_dynamics_sigma: 0.30 # 实际路径速度帧间动态标准差 (m/s)

      # ═══════════════════════════════════════════════
      #  RouteMonitor — 路径监控（投影连线 + 台阶阻塞）
      # ═══════════════════════════════════════════════
      route_monitor:
        proj_guard:
          cost_max: 240.0 # 投影连线最大障碍物代价 > 该值则取消 follow (0~255)
          cost_samples: 20 # 连线代价估计采样数
        step_block: # 有预测序列时台阶样本取 step_segments 的弧长区间；退化模式按原始格点 direction magnitude > 0.95 的物理本体判定
          enable: true # 是否启用"台阶被动态障碍物堵住"检测并触发全局重规划
          lookahead_distance: 5.0 # 沿当前全局路径向前检查距离 (m)
          sample_resolution: 0.2 # 路径空间积分分辨率上限；非预测模式会进一步限制到方向地图分辨率的一半
          predicted_obstacle_ratio_threshold: 0.8 # 预测地图模式下，台阶样本中被占据比例超过该阈值则触发重规划；每个台阶样本按计划到达时刻取对应预测帧，超出预测时域的台阶不计入
        performance:
          lookahead_distance: 6.0 # 性能下降时检查尚未进入 prepare 阶段的跨越段
