/**:
  ros__parameters:
    node:
      remaining_energy_filter_alpha: 0.5 # 对 remaining_energy_supercap 和 remaining_energy_buffercap 进行低通滤波的指数衰减系数 [0,1]
      path_publish_sample_resolution: 0.05 # 发布路径 global_path 和 minco_trajectory 的采样间距 (m)

      topics:
        goal_sub: "/decision/nav_goal"
        global_direction_map_sub: "/map_server/global_direction_map"
        global_cost_map_sub: "/map_server/global_cost_map"
        local_cost_maps_sub: "/map_server/local_cost_maps"
        chassis_status_sub: "/serial_bridge/chassis_status"
        comp_stage_sub: "/serial_bridge/comp_stage"
        spin_cmd_sub: "/decision/spin_cmd"
        global_path_pub: "/nav_executor/global_path"
        chassis_cmd_pub: "/nav_executor/chassis_cmd"
        state_pub: "/nav_executor/state"

      debug:
        enable: true
        final_cost_map_pub_topic: "/nav_executor/debug/final_cost_map"
        rough_path_pub_topic: "/nav_executor/debug/rough_path"
        warmup_path_pub_topic: "/nav_executor/debug/warmup_path"
        mpc_path_pub_topic: "/nav_executor/debug/mpc_path"
        minco_trajectory_pub_topic: "/nav_executor/debug/minco_trajectory"
        mpc_diag_pub_topic: "/nav_executor/debug/mpc_diag"
