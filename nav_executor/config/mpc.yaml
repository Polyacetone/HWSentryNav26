/**:
  ros__parameters:
    mpc:
      # ═══════════════════════════════════════════════
      #  Energy — 能量约束（电容电量不足时限制功率）
      # ═══════════════════════════════════════════════
      energy:
        enable: true # 是否启用能量约束（电容电量不足时限制功率）
        threshold: 600.0 # 电容能量惩罚阈值 (J)，低于此值开始惩罚
        weight: 0.0003 # 能量软约束权重

      # ═══════════════════════════════════════════════
      #  Follow — 路径跟踪求解器
      # ═══════════════════════════════════════════════
      follow:
        max_iters: 40 # FDDP 求解器最大迭代次数
        search:
          # Anytime MHA* 局部搜索播种器：在 FDDP 前做全局较优粗搜，跳出非凸局部最优。
          # 与 warm-shift 各跑一次 FDDP，取最终 cost 低者（Q5 双解比较）。
          enable: true # 是否启用搜索播种
          dt: 0.2 # 搜索步长 (s)，粗于 MPC_DT=0.05
          horizon_steps: 15 # 搜索时域步数（dt×steps=3.0s 覆盖 MPC 时域）
          theta_bins: 16 # 航向离散档数（22.5°/档）
          v_bin_size: 0.3 # 速度离散分辨率 (m/s)
          v_primitive_fracs: [1.0, 0.5, 0.0, -0.5] # 速度基元（>=0 乘 vel_max，<0 乘 |vel_min|），含后退
          omega_primitive_fracs: [-1.0, -0.5, 0.0, 0.5, 1.0] # 角速度基元（乘对应 omega bound）
          tau_v: 0.0 # 速度一阶滞后时间常数 (s)；<=0 时启动期由 LPV 模型自动推导
          budget_ms: 15.0 # anytime 时间预算 (ms)
          max_expansions: 4000 # 最大节点展开数
          collision_threshold: 200.0 # 代价 >= 该值视为不可通行
          goal_tolerance: 0.15 # 到达前瞻目标的距离阈值 (m)
          lookahead_distance: 3.0 # 沿样条设定前瞻目标点的弧长 (m)
          w_anchor: 2.0 # w1：不可采纳启发式膨胀系数
          w_inadmissible: 2.0 # w2：anchor 有界次优系数
          spline_bias: 0.5 # H1：偏向贴近全局样条的强度
          w_time: 0.2 # 每步时间/进度基代价
          w_obstacle: 1.0 # 避障（↔ environment_weights.obstacle）
          w_lateral: 0.3 # Frenet 横向误差（↔ tracking_weights.q_y）
          w_step_align: 1.0 # 台阶方向对齐（↔ terrain_weights.direction）
          w_step_reach: 0.8 # 台阶入口可达速度（↔ terrain_weights.step_reachability_*）
        rollout_safety:
          enable_lethal_obstacle_check: true # 对 follow rollout 做致命障碍物穿越检测；FDDP 最终解连续命中 N 帧则触发停止 + 重规划
          lethal_obstacle_threshold: 250.0 # rollout 插值代价值 >= 该阈值视为致命障碍物
          fddp_lethal_consecutive_threshold: 3 # FDDP 连续多少帧检测到致命障碍物后才触发停止 + 重规划，避免短暂抖动造成误打断
        command_bounds:
          vel_max: 2.0 # 线速度上限 (m/s)
          vel_min: -1.2 # 线速度下限 (m/s)
          omega_max: 6.0 # 角速度上限 (rad/s)
          omega_min: -6.0 # 角速度下限 (rad/s)
        motion_constraints:
          acc_max: 1.8 # 最大 dv_cmd/dt (m/s²)
          alpha_max: 7.0 # 最大 domega_cmd/dt (rad/s²)
          a_lat_max: 2.0 # 最大侧向加速度 |v_cmd*omega_cmd| (m/s²)
        start_command:
          vel_cmd_act_gap_max: 1.5 # 线速度指令与实际允许差值上限 (m/s)
          omega_cmd_act_gap_max: 3.0 # 角速度指令与实际允许差值上限 (rad/s)
        tracking_weights:
          q_y: 0.30 # 横向误差权重
          q_theta: 0.05 # 航向误差权重
          q_u: 0.8 # 每步进度权重
        command_weights:
          r_v: 0.01 # 线速度正则
          r_omega: 0.01 # 角速度正则
          r_dv: 0.2 # 线速度平滑
          r_domega: 0.1 # 角速度平滑
        motion_constraint_weights:
          acc_limit: 12.0 # 速度指令变化率超限惩罚
          alpha_limit: 12.0 # 角速度指令变化率超限惩罚
          lat_acc: 12.0 # 侧向稳定性惩罚（|v_cmd*omega_cmd| 超限）
        terrain_limits:
          step_reachability_guide_acc: 1.2 # 台阶入口可达势函数的引导加速度 (m/s^2)
        terrain_weights:
          step_vel_weight: 2.4 # 台阶内部仍保留原始速度范围惩罚，但权重降低
          step_reachability_lo: 0.8 # 入口前最小可达速度势函数权重，鼓励必要时后退腾挪并加速
          step_reachability_hi: 0.8 # 入口前最大可达速度势函数权重，避免以过高速度进入台阶
          direction: 1.0 # 台阶方向对齐权重（鼓励与方向场同向）
        environment_weights:
          obstacle: 1.0 # 避障权重（全局+局部融合代价）
        terminal_weights:
          q_v_final: 0.2 # 终端减速权重（全程激活）：v_allowed = sqrt(2 * a_brake * s + v_target^2)
          a_brake: 2.0 # m/s², 期望制动减速度
          slow_down_target_vel: 0.1 # m/s, 终点目标速度
        projection:
          num_samples: 50 # 投影到样条参数u的采样数
          search_window: 0.1 # 局部搜索窗口 (0~1)
          local_search_lazy_distance: 0.1 # 局部搜索找到合适投影点的距离阈值 (m)

      # ═══════════════════════════════════════════════
      #  Stop — 停止求解器
      # ═══════════════════════════════════════════════
      stop:
        max_iters: 20 # FDDP 求解器最大迭代次数
        command_bounds:
          vel_max: 2.8 # 线速度上限 (m/s)
          vel_min: 0.0 # 线速度下限 (m/s）
          omega_max: 12.5 # 角速度上限 (rad/s)
          omega_min: -12.5 # 角速度下限 (rad/s)
        start_command:
          vel_cmd_act_gap_max: 1.5 # 线速度指令与实际允许差值上限 (m/s)
          omega_cmd_act_gap_max: 3.0 # 角速度指令与实际允许差值上限 (rad/s)
        motion_constraints:
          acc_max: 1.8 # 最大 dv_cmd/dt (m/s²)
          alpha_max: 7.0 # 最大 domega_cmd/dt (rad/s²)
          a_lat_max: 2.4 # 最大侧向加速度 |v_cmd*omega_cmd| (m/s²)
        command_weights:
          r_v: 2.0 # 线速度正则
          r_omega: 0.2 # 角速度正则
          r_dv: 0.2 # 线速度指令平滑
          r_domega: 0.1 # 角速度指令平滑
        motion_constraint_weights:
          acc_limit: 12.0 # 速度指令变化率超限惩罚
          alpha_limit: 12.0 # 角速度指令变化率超限惩罚
          lat_acc: 12.0 # 侧向稳定性惩罚（|v_cmd*omega_cmd| 超限）
        environment_weights:
          obstacle: 1.0 # 避障惩罚（台阶区域已转为障碍物）
        terminal_weights:
          obstacle_terminal: 1.0 # 终端避障惩罚（防止停在障碍上）

      # ═══════════════════════════════════════════════
      #  Hold — 保持求解器
      # ═══════════════════════════════════════════════
      hold:
        max_iters: 20 # FDDP 求解器最大迭代次数
        command_bounds:
          vel_max: 1.2 # 线速度上限 (m/s)
          vel_min: -1.2 # 线速度下限 (m/s）
          omega_max: 1.6 # 角速度上限 (rad/s)
          omega_min: -1.6 # 角速度下限 (rad/s)
        start_command:
          vel_cmd_act_gap_max: 1.5 # 线速度指令与实际允许差值上限 (m/s)
          omega_cmd_act_gap_max: 3.0 # 角速度指令与实际允许差值上限 (rad/s)
        motion_constraints:
          acc_max: 1.8 # 最大 dv_cmd/dt (m/s²)
          alpha_max: 7.0 # 最大 domega_cmd/dt (rad/s²)
          a_lat_max: 2.4 # 最大侧向加速度 |v_cmd*omega_cmd| (m/s²)
        goal_weights:
          q_goal_xy: 0.3 # 每步目标点吸引（x/y误差）
          q_goal_theta: 0.2 # 朝向目标点
          goal_deadzone: 0.2 # 目标吸引死区半径，进入后不再因目标位置误差来回抽动 (m)
        command_weights:
          r_v: 0.01 # 线速度正则
          r_omega: 0.01 # 角速度正则
          r_dv: 0.2 # 线速度指令平滑
          r_domega: 0.1 # 角速度指令平滑
        motion_constraint_weights:
          acc_limit: 12.0 # 速度指令变化率超限惩罚
          alpha_limit: 12.0 # 角速度指令变化率超限惩罚
          lat_acc: 12.0 # 侧向稳定性惩罚（|v_cmd*omega_cmd| 超限）
        environment_weights:
          obstacle: 1.0 # 全程避障惩罚
        terminal_weights:
          q_goal_xy_terminal: 3.0 # 终端目标点吸引
          obstacle_terminal: 1.0 # 终端避障惩罚
