/**:
  ros__parameters:
    path_executor:
      # ═══════════════════════════════════════════════
      #  Misc — 常规配置
      # ═══════════════════════════════════════════════
      misc:
        stop_threshold_dist: 0.5 # 到达目标判定距离 (m)
        stop_threshold_remaining_distance: 0.5 # 到达目标判定的路径剩余弧长 (m)，须与终点距离同时满足
        step_dist_offset: 0.1 # 台阶本体边缘到下位机距离定义的标定偏移 (m)，正值增加报告距离
        command_history_timeout: 0.4 # 超时后按实测运动状态重建 MPC 指令状态 (s)

      # ═══════════════════════════════════════════════
      #  NoProgressGuard — 无进展检测守卫
      # ═══════════════════════════════════════════════
      no_progress_guard:
        follow:
          arc_length_landmark_spacing: 0.1 # 累计路径弧长的进度分箱宽度 (m)
          timeout: 6.0 # 无进度超时 (s)
        stepping:
          arc_length_landmark_spacing: 0.05 # 台阶状态使用更细的弧长进度分箱 (m)
          timeout: 6.0 # 无进度超时 (s)

      # ═══════════════════════════════════════════════
      #  StateMachine — SPIN 控制权交接互锁
      # ═══════════════════════════════════════════════
      state_machine:
        prepare_spin:
          command_velocity_max: 0.3 # MPC command state 的线速度门槛 (m/s)
          command_omega_max: 0.8 # MPC command state 的角速度门槛 (rad/s)
          measured_velocity_max: 0.3 # 底盘实测线速度门槛 (m/s)
          measured_omega_max: 0.8 # 底盘实测角速度门槛 (rad/s)

      # ═══════════════════════════════════════════════
      #  Recovery — 恢复行为
      # ═══════════════════════════════════════════════
      recovery:
        hazard:
          cost_threshold: 30.0 # 当前位置代价 >= 该值认为在危险区域 (0~255)
          step_norm_threshold: 0.06 # 当前位置方向场模长 >= 该值认为在危险台阶区域
        safe:
          cost_threshold: 5.0 # 当前位置代价 < 该值认为可通行
          step_norm_threshold: 0.01 # 当前位置方向场模长 < 该值认为可通行
        search:
          recovery_cost_threshold: 20.0 # 候选点插值代价上限，超过则不作为恢复目标
          radius_min: 0.5 # 搜索半径下界 (m)
          radius_max: 1.5 # 搜索半径上界 (m)
          radius_samples: 5 # 半径采样数
          angle_samples: 36 # 角度采样数
          path_integral_resolution: 0.05 # 路径积分采样精度 (m)
          path_integral_cost_weight: 1.0 # 路径积分中障碍代价权重
          path_integral_step_weight: 1.0 # 路径积分中台阶方向场权重
          step_ascent_penalty_weight: 5.0 # 上台阶轨迹惩罚权重
          step_ascent_penalty_norm_threshold: 0.3 # 方向场模长低于此值不惩罚
          step_ascent_penalty_dot_threshold: 0.2 # 路径方向与台阶上升方向点积 > 此值视为上台阶
          goal_timeout: 4.0 # 目标点超时 (s)，超时后重新搜索
        exit:
          safe_hold_time: 1.0 # 安全区域保持时间，超过后才退出恢复 (s)
        stuck:
          cmd_vel_threshold: 0.4 # 指令速度超过该值才开始检测 (m/s)
          timeout: 2.0 # 卡住判定持续时间阈值 (s)
          max_displacement: 0.2 # 位移小于该值判定卡住 (m)
          reverse_speed: 0.8 # 倒车速度 (m/s)
          reverse_displacement: 1.0 # 倒车退出位移阈值 (m)，里程计从 entry 起计
          reverse_timeout: 3.0 # 倒车安全网超时 (s)，MATURE 累计时间超时则打印 ERROR

    mpc:
      # ═══════════════════════════════════════════════
      #  Follow — 路径跟踪求解器
      # ═══════════════════════════════════════════════
      follow:
        max_iters: 20 # FDDP 求解器最大迭代次数
        progress:
          progress_reward: 0.5 # 每米路径推进线性奖励，防止零速局部最优
          speed_tracking_weight: 2.0 # 路径速度偏离规划期全局速度剖面的残差权重
          speed_smoothness_weight: 1.5 # 相邻路径速度变化残差权重
          overshoot_weight: 2.0 # 路径进度超过总弧长的残差权重
        rollout_safety:
          enable_lethal_obstacle_check: true # 对 follow rollout 做致命障碍物穿越检测；全局采样命中则直接判无效，FDDP 最终解连续命中 N 帧则触发停止 + 重规划
          lethal_obstacle_threshold: 250.0 # rollout 插值代价值 >= 该阈值视为致命障碍物
          fddp_lethal_consecutive_threshold: 3 # FDDP 连续多少帧检测到致命障碍物后才触发停止 + 重规划，避免短暂抖动造成误打断
        ancillary_feedback:
          enable: true # 是否启用辅助反馈环；在 MPC 预测模型与实际运动状态存在偏差时，使用实测状态修正 MPC 指令
          velocity_error_gain: 0.05 # 实测−名义速度误差到指令变化率修正的增益 (1/s)
          command_error_gain: 6.0 # 实际发送−名义速度指令误差的回正增益 (1/s)
          velocity_error_reanchor_threshold: 0.22 # 超出已验证误差管时重锚到实测状态 (m/s)
          velocity_command_margin: 0.0025 # 名义 MPC 预留给实际反馈的速度指令余量 (m/s)；最终命令仍使用完整 capability 硬边界。
          velocity_command_rate_margin: 0.02 # 名义 MPC 预留给实际反馈的速度指令变化率余量 (m/s²)；最终命令仍使用完整 capability 硬边界。
        capability: "medium" # 预设的能力配置，决定了下位机指令限幅
        start_command:
          vel_cmd_act_gap_max: 1.5 # 线速度指令与实际允许差值上限 (m/s)
          omega_cmd_act_gap_max: 3.0 # 角速度指令与实际允许差值上限 (rad/s)
        tracking_weights:
          contour: 2.0 # 位置曲线法向误差残差权重
          lag: 1.2 # 位置曲线切向误差残差权重，阻止路径进度空跑
          heading: 1.2 # 独立航向状态误差权重
          velocity: 0.8 # 前向路径速度对应的车身速度参考权重
          angular_velocity: 0.8 # 路径速度映射后的角速度参考权重
          tangent_blend_speed_scale: 0.05 # 路径轴向车身轴平滑过渡的平动速度尺度 (m/s)
        command_weights:
          r_v: 0.01 # 线速度正则
          r_omega: 0.01 # 角速度正则
          r_dv: 0.8 # 线速度平滑
          r_domega: 0.2 # 角速度平滑
          # jerk 残差使用相邻指令变化率之差除以 MPC_DT，抑制逐拍加速度反向。
          r_jerk_v: 0.02
          r_jerk_omega: 0.005
        command_dynamics_weights:
          lateral_acceleration: 18.0 # 横向加速度指令（|v_cmd*omega_cmd|）超限惩罚
        traversal_target_weights:
          velocity: 2.0 # v_actual 对共享台阶速度窗口的软目标
          direction: 2.4 # 台阶内部穿越方向对齐软目标
          angular_velocity_command: 0.1 # 台阶内部角速度指令趋零
          angular_velocity_predicted: 0.4 # 台阶内部预测车身角速度趋零
          velocity_command_smoothness: 0.1 # 台阶内部线速度指令增量平滑
          velocity_predicted_smoothness: 0.8 # 台阶内部预测车身速度增量平滑
        environment_weights:
          obstacle: 3.0 # 避障权重（全局+局部融合代价）
        terminal_weights:
          position: 0.6 # horizon 末端相对对应参考点的位置权重
          heading: 0.6 # horizon 末端航向权重
          velocity: 0.6 # horizon 末端线速度参考权重
          angular_velocity: 0.6 # horizon 末端角速度参考权重
          remaining_progress: 0.6 # horizon 末端剩余路径弧长线性代价
          overshoot: 1.2 # horizon 末端路径进度越界残差权重

      # ═══════════════════════════════════════════════
      #  Stop — 停止求解器
      # ═══════════════════════════════════════════════
      stop:
        max_iters: 20 # FDDP 求解器最大迭代次数
        capability: "bidirectional" # 停车允许零速和必要的反向制动命令
        start_command:
          vel_cmd_act_gap_max: 1.5 # 线速度指令与实际允许差值上限 (m/s)
          omega_cmd_act_gap_max: 3.0 # 角速度指令与实际允许差值上限 (rad/s)
        command_weights:
          r_v: 2.0 # 线速度正则
          r_omega: 0.2 # 角速度正则
          r_dv: 0.2 # 线速度指令平滑
          r_domega: 0.1 # 角速度指令平滑
          r_jerk_v: 0.02
          r_jerk_omega: 0.005
        command_dynamics_weights:
          lateral_acceleration: 18.0 # 横向加速度指令（|v_cmd*omega_cmd|）超限惩罚
        environment_weights:
          obstacle: 3.0 # 避障惩罚（台阶区域已转为障碍物）
        terminal_weights:
          obstacle_terminal: 1.0 # 终端避障惩罚（防止停在障碍上）

      # ═══════════════════════════════════════════════
      #  Hold — 保持求解器
      # ═══════════════════════════════════════════════
      hold:
        max_iters: 20 # FDDP 求解器最大迭代次数
        capability: "bidirectional" # 保持与危险恢复需要双向位置修正
        start_command:
          vel_cmd_act_gap_max: 1.5 # 线速度指令与实际允许差值上限 (m/s)
          omega_cmd_act_gap_max: 3.0 # 角速度指令与实际允许差值上限 (rad/s)
        goal_weights:
          q_goal_xy: 0.3 # 每步目标点吸引（x/y误差）
          q_goal_theta: 0.2 # 朝向目标点
          goal_deadzone: 0.2 # 目标吸引死区半径，进入后不再因目标位置误差来回抽动 (m)
        command_weights:
          r_v: 0.01 # 线速度正则
          r_omega: 0.01 # 角速度正则
          r_dv: 0.2 # 线速度指令平滑
          r_domega: 0.1 # 角速度指令平滑
          r_jerk_v: 0.02
          r_jerk_omega: 0.005
        command_dynamics_weights:
          lateral_acceleration: 18.0 # 横向加速度指令（|v_cmd*omega_cmd|）超限惩罚
        environment_weights:
          obstacle: 3.0 # 全程避障惩罚
        terminal_weights:
          q_goal_xy_terminal: 3.0 # 终端目标点吸引
          obstacle_terminal: 1.0 # 终端避障惩罚
