/**:
  ros__parameters:
    kinematic_model:
      # LPV scheduling: rho = clip((leg_h*cos(leg_psi) - z_ref) / z_scale, -rho_clip, rho_clip)
      z_ref: 0.23580140842179523
      z_scale: 0.09878295713260608
      rho_clip: 1.5
      # Smooth sign approximation epsilon used in tanh(x / sgn_eps)
      sgn_eps: 0.05

      # [x_h_dot, v_dot]^T = (Ac0 + rho*Ac1)[x_h, v]^T + (Bc0 + rho*Bc1) dv + Gnl*nl
      ca00: -2.771139173787186
      ca01: -6.326285593848927
      ca10: 1.4331331524492867
      ca11: 1.418575633080309
      cb0: 3.043085655265649
      cb1: 0.25273782815199863

      # Rho slopes for the continuous-time LPV matrices
      dca00: -0.14543013563523877
      dca01: 0.5204071581571662
      dca10: 0.011386296317887325
      dca11: 0.415624592430132
      dcb0: -1.0250096559918818
      dcb1: -0.18462234478438772

      # Nonlinear term: nl = cf1*tanh(v/sgn_eps) + cf2*v*abs(w)
      gxh: 0.050354158904313516
      gv: 0.11256891328894653
      cf1: -0.060332819651179447
      cf2: -0.9815536283425856

      # Yaw channel: w_dot = -(w_lam0 + rho*w_lam1) * w + (w_k0 + rho*w_k1) * dw - (w_cf0 + rho*w_cf1) * tanh(w/sgn_eps)
      w_lam0: 15.50971650372554
      w_k0: 16.131958812785463
      w_cf0: 0.5361899875358731
      w_lam1: 0.04378379430693363
      w_k1: 0.023828310633107176
      w_cf1: 0.07295561089659769

      # Shadow leg_psi residual model. Diagnostics only; it does not correct or
      # invalidate the longitudinal observer.
      psi_bias: 0.042975279908146834
      psi_gain: 0.19629303004811718
      psi_v: 0.2023843512379656

      # Longitudinal observer. Initialization is solved from the discrete model
      # so that the measured velocity is held for one prediction step.
      obs_lv: 4.484294986367658
      obs_v_correction_clip: 0.12
      obs_v_reset_threshold: 0.25
