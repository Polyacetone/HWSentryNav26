/**:
  ros__parameters:
    kinematic_model:
      # LPV scheduling: rho = clip((leg_h*cos(leg_psi) - z_ref) / z_scale, -rho_clip, rho_clip)
      z_ref: 0.23580140842179523
      z_scale: 0.09878295713260608
      rho_clip: 1.5
      # Smooth sign approximation epsilon used in tanh(x / sgn_eps)
      sgn_eps: 0.05

      # [x_h_dot, v_dot]^T = (Ac0 + rho*Ac1)[x_h, v]^T + (Bc0 + rho*Bc1) dv + Gnl*nl
      ca00: -2.8927427621550916
      ca01: -6.921585881789012
      ca10: 1.3847667781343795
      ca11: 1.5434642202222895
      cb0: 3.1006930883659978
      cb1: 0.25796295349405374

      # Rho slopes for the continuous-time LPV matrices
      dca00: -0.1322229939390674
      dca01: 0.4828405541386671
      dca10: 0.0041885385013589556
      dca11: 0.4081776942626388
      dcb0: -1.019706276167897
      dcb1: -0.18562933777357724

      # Nonlinear term: nl = cf1*tanh(v/sgn_eps) + cf2*v*abs(w)
      gxh: 0.11738297241619658
      gv: 0.32887232316829196
      cf1: -0.01571449358165795
      cf2: -0.3359141338668791

      # Yaw channel: w_dot = -(w_lam0 + rho*w_lam1) * w + (w_k0 + rho*w_k1) * dw - (w_cf0 + rho*w_cf1) * tanh(w/sgn_eps)
      w_lam0: 15.651602980854568
      w_k0: 16.24780468193183
      w_cf0: 0.5126213741249158
      w_lam1: 0.14628376008035154
      w_k1: 0.08361625361327188
      w_cf1: 0.03018853437140166

      # Shadow leg_psi residual model. Diagnostics only.
      psi_bias: 0.043012829036848874
      psi_gain: 0.18995972732721672
      psi_v: 0.2207546712499432

      # Longitudinal observer. Tune on grouped field data with optimize_observer.py.
      obs_lv: 3.0
      obs_v_correction_clip: 0.12
      obs_v_reset_threshold: 0.25
