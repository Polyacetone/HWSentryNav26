/**:
  ros__parameters:
    capability_management:
      # 每个控制周期向目标 capability 靠近的变化步长
      transition_per_tick:
        velocity: 0.06
        angular_velocity: 0.30
        velocity_rate: 0.03
        angular_velocity_rate: 0.10
        lateral_acceleration: 0.10

      # 下位机的三种指令限幅模式
      profiles:
        low:
          command_envelope:
            velocity: { min: -0.8, max: 1.5 }
            angular_velocity: { min: -4.0, max: 4.0 }
          command_dynamics:
            velocity_rate_max: 1.5 # 线速度指令变化率硬上限 (m/s²)
            angular_velocity_rate_max: 7.0 # 角速度指令变化率硬上限 (rad/s²)
            lateral_acceleration_max: 1.2
        medium:
          command_envelope:
            velocity: { min: -1.2, max: 2.2 }
            angular_velocity: { min: -6.0, max: 6.0 }
          command_dynamics:
            velocity_rate_max: 1.8 # 线速度指令变化率硬上限 (m/s²)
            angular_velocity_rate_max: 7.0 # 角速度指令变化率硬上限 (rad/s²)
            lateral_acceleration_max: 2.0
        high:
          command_envelope:
            velocity: { min: -1.2, max: 2.8 }
            angular_velocity: { min: -6.0, max: 6.0 }
          command_dynamics:
            velocity_rate_max: 1.8 # 线速度指令变化率硬上限 (m/s²)
            angular_velocity_rate_max: 7.0 # 角速度指令变化率硬上限 (rad/s²)
            lateral_acceleration_max: 2.0
