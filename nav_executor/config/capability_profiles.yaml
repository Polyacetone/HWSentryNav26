/**:
  ros__parameters:
    capability_management:
      # 每个控制周期向目标 capability 靠近的变化步长
      transition_per_tick:
        velocity: 0.06
        angular_velocity: 0.30
        velocity_rate: 0.03
        angular_velocity_rate: 0.10
        lateral_acceleration: 0.10

      # 普通规划与跟随使用三种非负速度能力；停车和保持使用独立双向能力。
      profiles:
        low:
          command_envelope:
            velocity: { min: 0.0, max: 1.5 }
            angular_velocity: { min: -4.0, max: 4.0 }
          command_dynamics:
            velocity_rate_max: 1.5
            angular_velocity_rate_max: 7.0
            lateral_acceleration_max: 1.2
        medium:
          command_envelope:
            velocity: { min: 0.0, max: 2.2 }
            angular_velocity: { min: -6.0, max: 6.0 }
          command_dynamics:
            velocity_rate_max: 1.8
            angular_velocity_rate_max: 7.0
            lateral_acceleration_max: 2.0
        high:
          command_envelope:
            velocity: { min: 0.0, max: 2.8 }
            angular_velocity: { min: -6.0, max: 6.0 }
          command_dynamics:
            velocity_rate_max: 1.8
            angular_velocity_rate_max: 7.0
            lateral_acceleration_max: 2.0
        bidirectional:
          command_envelope:
            velocity: { min: -1.2, max: 1.2 }
            angular_velocity: { min: -6.0, max: 6.0 }
          command_dynamics:
            velocity_rate_max: 1.8
            angular_velocity_rate_max: 7.0
            lateral_acceleration_max: 2.0
