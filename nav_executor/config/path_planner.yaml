/**:
  ros__parameters:
    path_planner:
      traversability:
        occupied_threshold: 100 # 格子代价值超过该值就认为不可通行（0~255）
        on_step_threshold: 0.1 # 起点、终点和 nudge 候选处的插值方向场模长须低于该值；覆盖整个膨胀场安全区

      nudge:
        max_distance: 1.0 # 在 cost_map 的 merged 图层上搜索空闲格子的最大 BFS 半径（米）

      dynamic_prediction:
        horizon_seconds: 2.0 # 融合局部代价地图预测帧的时间窗口，0 表示只用当前帧
        weight_decay: 0.6 # 时间窗口内各预测帧的权重线性衰减系数 [0,1]，1 表示不衰减

      planner:
        goal_reached_distance: 0.5 # 机器人到终点距离小于该值时认为已到达，直接标记 COMPLETE
        seed_resample_distance: 0.5 # 全局动力学搜索见证的路径点重采样间隔（米），决定 MINCO 分成多少段
        start_yaw_relaxation:
          root_bias_seconds: 0.67 # 使用松弛航向根的固定 OPEN 排序偏置（秒）
          yaw_bias_seconds_per_rad: 0.17 # 松弛根相对实测 yaw 每旋转 1 rad 的排序偏置（秒/rad）
          max_discarded_velocity: 0.5 # 真实速度投影到候选航向后，允许丢弃的速度分量上限（m/s）

      shaping_dynamics: # State-lattice/MINCO 共用；只让动力学塑造几何，不生成最终参考速度。
        velocity_max: 3.0 # 动力学见证的线速度上限（m/s）
        tangential_acceleration_max: 1.5 # 标量速度变化率 |d speed/dt| 上限（m/s²）
        angular_velocity_max: 6.0 # 角速度上限（rad/s）
        angular_acceleration_max: 7.0 # 角加速度上限（rad/s²）
        lateral_acceleration_max: 2.0 # 侧向加速度 |κ|v² 上限（m/s²）

      spatial_astar:
        obstacle_weight: 1.0 # 归一化障碍软代价乘数；1.0 表示接近占据阈值时边代价约翻倍
        max_expansions: 1000000 # 二维空间 A* 最大展开数

      reference_path:
        resample_spacing: 0.10 # LOS 平滑后参考路径的最大重采样间距（米）
        tangent_lookahead: 0.30 # 平坦区域参考切向的前后差分距离（米）

      guide_field:
        corridor_width: 2.0 # 参考路径两侧的自由空间测地走廊宽度（米）

      state_lattice:
        xy_resolution: 0.05 # root-relative canonical lattice 位置分辨率（米）
        heading_bins: 80 # canonical 航向数量，80 对应 4.5°
        collision_check_resolution: 0.075 # 空间原语碰撞与地形检查的最大步长（米）
        goal_connection_max_length: 1.0 # 近目标直线 seed connector 允许的最大长度（米）
        goal_tolerance: 1.0 # 进入该欧氏距离后尝试连接真实目标位置（米）
        speed_bin_count: 13 # 离散速度值数量（含 0）；13 对应 0.25 m/s 间隔
        guidance_weight: 1.0 # 非 admissible 参考启发的整体 OPEN 排序强度
        deviation_weight: 1.0 # 偏离参考路径的时间等效权重
        heading_weight: 0.25 # 航向偏差权重（秒/rad）
        speed_weight: 0.5 # 参考速度偏差的时间等效权重
        max_expansions: 500000 # 最多展开多少个节点，防止爆内存或搜索时间过长

      motion_primitives:
        curvature_magnitudes: [1.0, 4.0, 0.25, 1.0, 0.0625, 0.25] # 三个长度带各自的两个 nominal 曲率幅值
        band_lengths: [0.32, 0.63, 1.26] # 与曲率带对应的原语长度（米）
        straight_length: 1.26 # nominal 直行动作长度（米）
        curvature_max: 4.0 # nominal 原语允许的最大几何曲率（1/m）

      minco:
        directed_speed_min: 0.05 # 见证速度沿种子方向的正则下限，仅用于排除尖点和逆向（m/s）
        penalty_weights:
          energy: 1.0 # 物理 min-jerk 能量权重
          time: 16.0 # 动力学见证总时长权重；只参与几何塑形
          obstacle: 1000.0 # 障碍物权重：撞墙的惩罚，越大越不可能穿墙
          velocity: 100.0 # 见证线速度超限惩罚
          tangential_acceleration: 100.0 # 切向加速度 |d speed/dt| 超限惩罚
          angular_velocity: 100.0 # 角速度超限惩罚
          angular_acceleration: 100.0 # 角加速度超限惩罚
          lateral_acceleration: 100.0 # 侧向加速度 |κ|v² 超限惩罚
          directed_regularity: 1000.0 # 有向正则性：排除内部零速点、尖点与逆向
          traversal_velocity_window: 1600.0 # runup 起点至台阶出口的地形目标速度窗软约束
          traversal_alignment: 1600.0 # runup 起点至台阶出口的方向对齐软约束
          traversal_tangential_acceleration: 10.0 # runup 起点至台阶出口的 a_t² 正则
          traversal_angular_velocity: 10.0 # runup 起点至台阶出口的 ω² 正则
          prohibited_traversal: 1000.0 # 往台阶禁止方向（如逆行）走的惩罚
          runup_curvature: 100.0 # runup 起点至台阶出口的 κ² 正则
        terrain_gate:
          norm_lo: 0.1 # 方向场模长低于此值时不施加地形软约束
          norm_hi: 0.9 # 方向场模长高于此值时施加完整软约束
        samples_per_segment: 16 # 每段 MINCO 轨迹上采多少个点来施加约束和惩罚
        runup:
          body_norm_lo: 0.9 # 助跑源门控下界；非本体膨胀 cap=229/255 小于该值
          body_norm_hi: 0.95 # 助跑源门控上界；仅物理本体附近达到完整强度
          saturation_length: 0.05 # 往前看台阶暴露量时的饱和弧长（米），暴露量超过此尺度后助跑惩罚不再增加
          transition_distance: 0.1 # 助跑区边界往外平滑过渡的弧长宽度（米），让助跑效果逐渐消失而非突然截断
        max_iterations: 2000 # block-scaled Armijo L-BFGS 最大 accepted step 数
        optimizer:
          position_scale: 0.5 # 每个 2D waypoint block 的物理尺度（米）
          physical_time_scale: 0.1 # 每个 time block 的目标物理尺度（秒）
          max_virtual_time_scale: 20.0 # softplus Jacobian 很小时 virtual-time scale 的上限
          max_function_evaluations: 4000 # 含初始评估及所有 rejected trial
          history_size: 8 # 保留的 L-BFGS (s,y) 对数
          first_order_tolerance: 1.0e-5 # max_block ‖D_b g_b‖₂ / max(1,|f|) 一阶最优性阈值
          relative_cost_tolerance: 1.0e-5 # accepted step 的相对目标改善低于此值时计入实际收益收敛窗口
          cost_convergence_window: 10 # 连续多少次低收益 accepted step 后判为 COST_CONVERGED
          scaled_step_tolerance: 1.0e-12 # 归一化 block 步长停滞阈值
          trust_region:
            initial_radius: 0.5 # Armijo 首次试探的 max-step cap（无量纲 block 坐标）
            min_radius: 1.0e-10 # 最小 max-step cap（无量纲 block 坐标）
            max_radius: 2.0 # 最大 max-step cap（无量纲 block 坐标）
            acceptance_ratio: 0.1 # 保留兼容；Armijo 不使用此接受阈值
            shrink_ratio: 0.25 # 保留兼容；Armijo 不使用此阈值
            expansion_ratio: 0.75 # rho 超过此值的高可信边界步才扩大 max-step cap
            shrink_factor: 0.25 # Armijo 拒绝后的 max-step cap 回溯因子
            expansion_factor: 2.0 # 高可信边界步的 max-step cap 扩大因子
            max_consecutive_rejections: 20 # Armijo 连续拒绝上限
            history_reset_after_rejections: 3 # 达到此次数触发归一化 -gradient rescue
          curvature_relative_threshold: 1.0e-8 # sy > eps*||s||*||y|| 才接受曲率对
          history_acceptance_ratio: 0.25 # 低模型可信度的 accepted step 不写入历史
        min_segment_time: 0.05 # 每段动力学见证的最短物理时长（秒）

      environment_validation: # 环境验收：路径与代价地图、方向地形的关系
        samples_per_segment: 20 # 每段空间曲线的碰撞与地形检查采样数下限
        traversal_angle_tolerance: 0.4 # 台阶方向角允许偏差，只记录软诊断（rad）

      speed_profile:
        discretization:
          max_spacing: 0.15 # 平坦区域最大弧长节点间隔 (m)
          step_max_spacing: 0.05 # capability blend 与台阶区域最大节点间隔 (m)
          curvature_refine_threshold: 0.15 # 区间曲率变化超过该值时递归细分 (1/m)
          envelope_sample_spacing: 0.025 # 区间内动力学包络的采样间隔 (m)
        objective:
          traversal_window: 20.0 # 台阶平方速度窗松弛的弧长积分权重
          lateral_acceleration: 18.0 # 侧向加速度超限的弧长积分权重；阈值来自当前 capability
          global_speed_reward: 0.05 # 无更重要目标时提高平方速度的小权重
          velocity_scale: 2.2 # 平方速度目标的无量纲归一参考速度 (m/s)，保持两类目标权重比例
        stationary_velocity_threshold: 0.1 # 小于该值的路径切向初速度按静止处理 (m/s)

      step:
        detection: # 物理边界固定按原始格点 direction magnitude > 0.95 判定
          detect_dot_threshold: 0.5 # 路径方向与台阶方向点积的阈值：大于此值判定为上台阶，小于负的此值判定为下台阶
          path_sample_resolution: 0.05 # 台阶标注弧长采样间距上限；实际不超过方向地图分辨率的一半（米）
        execution:
          profile_prepare_distance: 2.0 # 从 STEPPING/PREPARING 起点到 commit 点的距离，在这段距离内逐步切换底盘能力配置（米）
          chassis_activation_distance: 1.0 # 从 STEPPING/ARMED 起点到 commit 点的距离；开始发送可撤销的台阶提示，commit 前仍可抢占（米）
          fsm_release_distance: 0.3 # 走出物理台阶后，FSM 额外再往前推多远才退出 STEPPING 状态（米）
        mpc_constraints:
          gate_transition_distance: 0.3 # 台阶内部 MPC 约束窗两侧的软门控过渡带宽度（米），让约束逐渐生效而非硬开关

      step_mask:
        path_align_dot_threshold: 0.6 # 路径方向与台阶方向点积 ≥ 此值就认为路径经过了该台阶
        full_effect_radius: 0.6 # 台阶掩码施加满强度的半径（米）
        cutoff_radius: 1.0 # 台阶掩码截止半径（米），超过此范围完全不受影响
        length_num_samples: 100 # 估算路径弧长时的采样点数
