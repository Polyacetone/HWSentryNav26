/**:
  ros__parameters:
    path_planner:
      # ═══════════════════════════════════════════════
      #  Planner — 规划器配置
      # ═══════════════════════════════════════════════
      planner:
        goal_reached_distance: 0.5 # robot-to-goal 近距离短路阈值 (m)：< 此值则 COMPLETE / USE_AS_FIXED
        skip_distance: 0.5 # 起终点距离 < 此值时跳过 A* 直接构造样条初值 (m)
        a_star:
          step_alignment_weight: 6.0 # A* 台阶对齐代价权重
          obstacle_weight: 4.0 # A* 障碍物代价权重
          step_proximity_weight: 0.6 # A* 台阶接近度代价权重
          step_mode_dot_threshold: 0.3 # A* 方向禁止通行的点积阈值
          downsampled_waypoint_max_interval: 5 # A* 路径降采样最大间隔
          feasible_threshold: 100 # A* 格子可通行性判定代价阈值 (0~255)

      # ═══════════════════════════════════════════════
      #  Traversability — 通行性规则（planner 可行性判定）
      # ═══════════════════════════════════════════════
      traversability:
        occupied_threshold: 50 # 格子代价 > 该值则不可通行 (0~255)
        on_step_threshold: 0.1 # 方向场模长 > 该值则视为在台阶上不可规划起点

      # ═══════════════════════════════════════════════
      #  Nudge — 起点/终点 nudging
      # ═══════════════════════════════════════════════
      nudge:
        max_distance: 1.0 # merged 上搜索 free 格子的最大 BFS 半径 (m)

      # ═══════════════════════════════════════════════
      #  StartPrediction — 起点前推预测
      # ═══════════════════════════════════════════════
      start_prediction:
        enable: true # 是否启用起点前推预测
        max_accel: 2.0 # 最大减速度 (m/s²)，用于估算制动距离
        planning_delay: 0.2 # A* + 样条期望耗时 (s)
        min_speed: 0.3 # 低于该速度不做起点前推 (m/s)
        collision_check_step: 0.05 # 预测起点直线可达性采样间隔 (m)

      # ═══════════════════════════════════════════════
      #  StepMask — 台阶掩码（AnnotatedPath 产出）
      # ═══════════════════════════════════════════════
      step_mask:
        path_align_dot_threshold: 0.6 # 路径切向与台阶方向点积 >= 该值则认为路径经过台阶
        full_effect_radius: 0.6 # 掩码满强度半径 (m)
        cutoff_radius: 1.0 # 掩码截止半径 (m)
        length_num_samples: 100 # 路径弧长估计采样数

      # ═══════════════════════════════════════════════
      #  Step — 台阶检测（规划期 step_annotator 使用）
      # ═══════════════════════════════════════════════
      step:
        detection:
          detect_norm_threshold: 0.9 # 方向场模长阈值，用于检测台阶 enter/exit
          detect_dot_threshold: 0.5 # 路径切向与台阶方向点积阈值；>阈值为上台阶，<-阈值为下台阶
          path_sample_resolution: 0.05 # 沿路径采样分辨率 (m)
        execution:
          profile_prepare_distance: 2.0 # capability profile 渐变起点 → commit 点距离 (m)
          chassis_activation_distance: 1.0 # 底盘台阶模式与 FSM 不可抢占起点 → commit 点距离 (m)
          fsm_release_distance: 0.3 # STEPPING 退出点相对物理台阶出口的额外推进距离 (m)
        mpc_constraints:
          approach_distance: 2.0 # 入口速度可达性约束起点 → commit 点距离 (m)
          gate_transition_distance: 0.3 # 台阶内部 MPC 约束窗两侧软门控过渡带宽度 (m)

      # ═══════════════════════════════════════════════
      #  BSplineOptimizer — 样条路径优化
      # ═══════════════════════════════════════════════
      path_optimizer:
        step_norm_threshold: 0.01 # 优化器中判断台阶区域的模长下界
        step_norm_transition: 0.05 # 台阶门控函数的平滑过渡区间
        step_detection_samples_per_meter: 10.0 # 台阶区间检测采样密度 (samples/m)

        warmup:
          samples_per_meter: 10.0 # warmup 阶段采样密度
          max_iterations: 60 # warmup 最大优化迭代次数
          max_curvature: 1.2 # warmup 阶段全局曲率上限
          obstacle_weight: 2.0 # 障碍物代价权重
          direction_weight: 20.0 # 方向对齐代价权重
          step_weight: 0.25 # 台阶区域穿越代价权重
          start_end_weight: 30.0 # 起终点位置约束权重
          smoothness_weight: 0.005 # 样条光滑性正则权重
          length_penalty_weight: 0.02 # 路径长度惩罚权重
          curvature:
            base_weight: 0.1 # 曲率基础惩罚权重
            base_beta: 4.0 # 曲率基础惩罚 softplus beta
            limit_weight: 10.0 # 曲率超限惩罚权重
            limit_beta: 16.0 # 曲率超限惩罚 softplus beta
            min_speed_epsilon: 0.05 # 低速时曲率计算的正则化 epsilon (m/s)
            speed_gate_threshold: 0.15 # 速度门控阈值，低速时抑制曲率代价 (m/s)

        main:
          samples_per_meter: 10.0 # main 阶段采样密度
          max_iterations: 60 # main 每次迭代的最大优化步数
          max_refinement_iterations: 1 # main 阶段细化迭代次数（台阶区间收敛后停止）
          near_max_curvature: 0.3 # 台阶附近区域曲率上限
          far_max_curvature: 1.6 # 远离台阶区域曲率上限
          step_extension_distance: 0.3 # 台阶区间前后扩展距离 (m)
          step_transition_distance: 0.3 # 近/远曲率之间平滑过渡距离 (m)
          interval_iou_threshold: 0.85 # 台阶区间 IoU 阈值，收敛后提前退出细化
          obstacle_weight: 2.0 # 障碍物代价权重
          direction_weight: 60.0 # 方向对齐代价权重
          step_weight: 0.25 # 台阶区域穿越代价权重
          start_end_weight: 30.0 # 起终点位置约束权重
          smoothness_weight: 0.003 # 样条光滑度正则权重
          length_penalty_weight: 0.02 # 路径长度惩罚权重
          curvature:
            base_weight: 0.1 # 曲率基础惩罚权重
            base_beta: 4.0 # 曲率基础惩罚 softplus beta
            limit_weight: 15.0 # 曲率超限惩罚权重
            limit_beta: 16.0 # 曲率超限惩罚 softplus beta
            min_speed_epsilon: 0.05 # 低速时曲率计算的正则 epsilon (m/s)
            speed_gate_threshold: 0.15 # 速度门控阈值，低速时抑制曲率代价 (m/s)
