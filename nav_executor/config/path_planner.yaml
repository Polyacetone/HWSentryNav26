/**:
  ros__parameters:
    path_planner:
      # ═══════════════════════════════════════════════
      #  Planner — 规划器配置
      # ═══════════════════════════════════════════════
      planner:
        goal_reached_distance: 0.5 # robot-to-goal 近距离短路阈值 (m)：< 此值则 COMPLETE / USE_AS_FIXED
        skip_distance: 0.5 # 起终点距离 < 此值时跳过 kinodynamic 直接直连种子 (m)
        seed_resample_distance: 0.5 # kinodynamic 种子重采样间隔 (m)，决定 MINCO 段数（预留）

      # ═══════════════════════════════════════════════
      #  Dijkstra — cost-to-goal 场（kinodynamic 启发 + 开阔 seed）
      # ═══════════════════════════════════════════════
      dijkstra:
        obstacle_weight: 0.02 # 障碍代价系数（cost∈[0,255] 与步长同量级缩放）
        feasible_threshold: 200 # cost >= 此值不扩散 (0~255)

      # ═══════════════════════════════════════════════
      #  Kinodynamic A* — 最简差速车拓扑发现
      # ═══════════════════════════════════════════════
      kinodynamic:
        vel_max: 2.0 # 线速度上限 (m/s)
        vel_min: -1.6 # 线速度下限（倒车）(m/s)
        omega_max: 6.0 # 角速度上限 (rad/s)
        accel_max: 1.8 # 线加速度上限 (m/s²)
        a_lat_max: 2.0 # 侧向加速度上限 |v·ω| (m/s²)
        accel_samples: 5 # [-accel_max, accel_max] 采样数
        omega_samples: 7 # [-omega_max, omega_max] 采样数
        primitive_duration: 0.3 # 每原语积分时长 (s)
        collision_substeps: 4 # 原语内碰撞检查细分步数
        dedup_xy: 0.2 # 位置去重分辨率 (m)
        dedup_theta: 0.314 # 朝向去重分辨率 (rad) ≈18°
        dedup_v: 0.4 # 速度去重分辨率 (m/s)
        time_weight: 1.0 # 每原语时长代价
        reverse_weight: 0.3 # 倒车额外代价（偏好前进，不禁止）
        heuristic_weight: 1.0 # Dijkstra h 权重（>1 加速但失最优性）
        goal_tolerance: 0.3 # 到 goal 位置容差 (m)
        max_expansions: 200000 # 展开节点上限（内存/时间护栏）

      # ═══════════════════════════════════════════════
      #  MINCO — 时空优化（自研 GCOPTER 思路）
      # ═══════════════════════════════════════════════
      minco:
        weights:
          energy: 1.0 # min-jerk 能量
          time: 16.0 # 总时长
          obstacle: 1000.0 # 障碍罚
          velocity: 100.0 # 带符号速度界
          lateral_acc: 100.0 # |v·ω| ≤ a_lat
          omega: 100.0 # |ω| 界
          accel: 100.0 # |a| 界
          theta_rate: 1.0 # θ̇ 正则
          heading_follow: 1.0 # |v| 大时 θ 跟随运动方向软偏好
          step_alignment: 200.0 # 台阶内车身轴与方向场对齐
          step_velocity: 200.0 # 台阶内按所选模式约束速度窗
        limits:
          vel_max: 2.0
          vel_min: -1.6
          omega_max: 6.0
          acc_max: 1.8
          a_lat_max: 2.0
        samples_per_segment: 16 # 每段约束采样点数
        step_entry_window_fraction: 0.25 # 入口前后相邻段施加软速度窗的局部比例
        max_iterations: 200 # L-BFGS 每轮最大迭代
        nonholonomic:
          rho_init: 50.0 # AL 初始罚因子
          rho_max: 10000.0 # AL 罚因子上限
          rho_scale: 3.0 # 每轮 AL 放大
          al_rounds: 10 # AL 外层轮数
          tolerance: 0.01 # AL 提前收敛目标：max|横向速度| (m/s)
          acceptance_tolerance: 0.10 # 最终接纳上限；0.08m/s 在 1.6m/s 时约为 2.9° 速度方向偏差
        min_segment_time: 0.05 # 段时长下限 (s)
        validation:
          samples_per_segment: 32 # 最终验收逐段采样数；每段包含两端点
          velocity_tolerance: 0.1 # 一般带符号速度与入口速度窗容差 (m/s)
          omega_tolerance: 0.1 # 角速度上限容差 (rad/s)
          acceleration_tolerance: 0.1 # 平动加速度上限容差 (m/s²)
          lateral_acceleration_tolerance: 0.1 # |v*omega| 上限容差 (m/s²)
          step_velocity_tolerance: 0.1 # 台阶内部速度窗容差 (m/s)

      # ═══════════════════════════════════════════════
      #  Traversability — 通行性规则（planner 可行性判定）
      # ═══════════════════════════════════════════════
      traversability:
        occupied_threshold: 50 # 格子代价 > 该值则不可通行 (0~255)
        on_step_threshold: 0.1 # 方向场模长 > 该值则视为在台阶上不可规划起点

      # ═══════════════════════════════════════════════
      #  Nudge — 起点/终点 nudging
      # ═══════════════════════════════════════════════
      nudge:
        max_distance: 1.0 # merged 上搜索 free 格子的最大 BFS 半径 (m)

      # ═══════════════════════════════════════════════
      #  StartPrediction — 起点前推预测
      # ═══════════════════════════════════════════════
      start_prediction:
        enable: true # 是否启用起点前推预测
        max_accel: 2.0 # 最大减速度 (m/s²)，用于估算制动距离
        planning_delay: 0.2 # Dijkstra + Kinodynamic A* + MINCO 期望耗时 (s)
        min_speed: 0.3 # 低于该速度不做起点前推 (m/s)
        collision_check_step: 0.05 # 预测起点直线可达性采样间隔 (m)

      # ═══════════════════════════════════════════════
      #  StepMask — 台阶掩码（AnnotatedPath 产出）
      # ═══════════════════════════════════════════════
      step_mask:
        path_align_dot_threshold: 0.6 # 路径切向与台阶方向点积 >= 该值则认为路径经过台阶
        full_effect_radius: 0.6 # 掩码满强度半径 (m)
        cutoff_radius: 1.0 # 掩码截止半径 (m)
        length_num_samples: 100 # 路径弧长估计采样数

      # ═══════════════════════════════════════════════
      #  Step — 台阶检测（规划期 step_annotator 使用）
      # ═══════════════════════════════════════════════
      step:
        detection:
          detect_norm_threshold: 0.9 # 方向场模长阈值，用于检测台阶 enter/exit
          detect_dot_threshold: 0.5 # 路径切向与台阶方向点积阈值；>阈值为上台阶，<-阈值为下台阶
          path_sample_resolution: 0.05 # 沿路径采样分辨率 (m)
        execution:
          profile_prepare_distance: 2.0 # capability profile 渐变起点 → commit 点距离 (m)
          chassis_activation_distance: 1.0 # 底盘台阶模式与 FSM 不可抢占起点 → commit 点距离 (m)
          fsm_release_distance: 0.3 # STEPPING 退出点相对物理台阶出口的额外推进距离 (m)
        mpc_constraints:
          gate_transition_distance: 0.3 # 台阶内部 MPC 约束窗两侧软门控过渡带宽度 (m)
