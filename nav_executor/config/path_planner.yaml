/**:
  ros__parameters:
    path_planner:
      traversability:
        occupied_threshold: 100 # 格子代价值超过该值就认为不可通行（0~255）
        on_step_threshold: 0.1 # 起点、终点和 nudge 候选处的插值方向场模长须低于该值；覆盖整个膨胀场安全区

      nudge:
        max_distance: 1.0 # 在 cost_map 的 merged 图层上搜索空闲格子的最大 BFS 半径（米）

      dynamic_prediction:
        horizon_seconds: 2.0 # 融合局部代价地图预测帧的时间窗口，0 表示只用当前帧
        weight_decay: 0.6 # 时间窗口内各预测帧的权重线性衰减系数 [0,1]，1 表示不衰减

      planner:
        goal_reached_distance: 0.5 # 机器人到终点距离小于该值时认为已到达，直接标记 COMPLETE
        seed_resample_distance: 0.5 # kinodynamic 搜索结果的路径点重采样间隔（米），决定 MINCO 分成多少段
        start_yaw_relaxation:
          speed_threshold: 0.5 # 实测速度不高于该值时，额外允许从最低前进速度的全航向根开始搜索 (m/s)
          root_penalty: 2.0 # 使用松弛航向根的固定等效路径长度代价 (m)，优先保留真实起始运动状态
          yaw_penalty: 0.5 # 松弛根相对真实 yaw 每旋转 1 rad 的附加等效路径长度 (m/rad)

      dijkstra:
        obstacle_weight: 0.02 # 障碍代价系数，把 cost_map 的 0~255 代价值缩放到与路径步长可比的数量级
        feasible_threshold: 200 # 格子代价值 ≥ 此值就不再从此格子向外扩散搜索（0~255）

      kinodynamic:
        state_limits:
          speed_max: 3.0 # 前向平坦状态的最大速度 (m/s)
          angular_velocity_max: 6.0 # 最大转向角速度（rad/s）
          acceleration_max: 1.5 # 最大加减速度（m/s²）
          lateral_acceleration_max: 2.0 # 最大侧向加速度，即 |速度 × 角速度|（m/s²），限制转弯不侧滑
        curvature_samples: 7 # 三次密集于零的曲率采样数，兼顾高速缓弯和低速急弯
        curvature_max: 4.0 # 几何种子的最大曲率（1/m）；实际可用曲率还受速度、角速度和加速度限制
        primitive_length: 0.3 # 每条空间运动原语的弧长（米）
        collision_check_resolution: 0.075 # 空间原语碰撞、地形和速度区间传播的最大步长（米）
        goal_connection_max_length: 1.0 # 近目标恒曲率几何连接允许的最大弧长（米）
        dedup_xy: 0.2 # 位置去重的分辨率：两格靠多近视为同一个状态（米）
        dedup_theta: 0.314 # 朝向去重的分辨率（弧度），约 18°
        heuristic_weight: 3.0 # 空间 Dijkstra 的 Weighted A* 权重；前端只需快速找到可优化的可行拓扑
        goal_tolerance: 0.3 # 进入该欧氏距离后尝试恒曲率几何终点连接（米）
        max_expansions: 500000 # 最多展开多少个节点，防止爆内存或搜索时间过长

      trajectory_limits: # MINCO 形状优化与速度剖面共用的规划限值来源。
        velocity_max: 3.0 # 路径速度幅值上限（m/s）
        acceleration_max: 1.5 # 切向加速度上限（m/s²）
        angular_velocity_max: 6.0 # 角速度上限（rad/s）
        angular_acceleration_max: 7.0 # 角加速度上限（rad/s²）
        lateral_acceleration_max: 2.0 # 侧向加速度上限（m/s²）
        min_trackable_speed: 0.6 # 经实验降额的最低可稳定跟踪速度（m/s），曲率包络在此速度取等号
        directed_speed_min: 0.05 # 有向正则性下限：速度沿种子方向分量的最小值（m/s）

      minco:
        penalty_weights:
          energy: 0.6 # 平滑性权重：最小化 jerk（加加速度），越大轨迹越平滑柔和
          time: 20.0 # 归一化参数总长权重（弧长代理），越大轨迹越短
          obstacle: 1000.0 # 障碍物权重：撞墙的惩罚，越大越不可能穿墙
          parameterization_velocity: 100.0 # ‖p_τ‖ 不超过速度上限，保持 τ 与弧长量级可比
          directed_regularity: 1000.0 # 有向正则性：排除内部零速点、尖点与逆向
          curvature: 400.0 # 真实几何曲率无量纲 Huber 违规的弧长积分
          curvature_rate: 200.0 # 曲率变化率无量纲 Huber 违规的弧长积分，抑制极短距离内建立大角速度
          traversal_alignment: 1600.0 # 过台阶时让车身顺着台阶方向走的对齐惩罚
          prohibited_traversal: 1000.0 # 往台阶禁止方向（如逆行）走的惩罚
          runup_curvature: 100.0 # 台阶膨胀过渡、本体及其助跑区内的 κ² 正则
        terrain_gate:
          norm_lo: 0.1 # 方向场模长低于此值时不施加地形软约束
          norm_hi: 0.9 # 方向场模长高于此值时施加完整软约束
        samples_per_segment: 16 # 每段 MINCO 轨迹上采多少个点来施加约束和惩罚
        runup:
          body_norm_lo: 0.9 # 助跑源门控下界；非本体膨胀 cap=229/255 小于该值
          body_norm_hi: 0.95 # 助跑源门控上界；仅物理本体附近达到完整强度
          saturation_length: 0.05 # 往前看台阶暴露量时的饱和弧长（米），暴露量超过此尺度后助跑惩罚不再增加
          transition_distance: 0.1 # 助跑区边界往外平滑过渡的弧长宽度（米），让助跑效果逐渐消失而非突然截断
        max_iterations: 2000 # trust-region L-BFGS 最大 accepted step 数
        optimizer:
          position_scale: 0.5 # 每个 2D waypoint block 的物理尺度（米）
          physical_time_scale: 0.1 # 每个 time block 的目标物理尺度（秒）
          max_virtual_time_scale: 20.0 # softplus Jacobian 很小时 virtual-time scale 的上限
          max_function_evaluations: 4000 # 含初始评估及所有 rejected trial
          history_size: 8 # 保留的 L-BFGS (s,y) 对数
          first_order_tolerance: 1.0e-5 # max_block ‖D_b g_b‖₂ / max(1,|f|) 一阶最优性阈值
          relative_cost_tolerance: 1.0e-5 # accepted step 的相对目标改善低于此值时计入实际收益收敛窗口
          cost_convergence_window: 10 # 连续多少次低收益 accepted step 后返回 COST_CONVERGED
          scaled_step_tolerance: 1.0e-8 # 归一化 block 步长停滞阈值
          trust_region:
            initial_radius: 0.5 # trust-region 初始半径（米）
            min_radius: 1.0e-6 # trust-region 最小半径（米）
            max_radius: 2.0 # trust-region 最大半径（米）
            acceptance_ratio: 0.1 # 归一化 trial step 的 accepted ratio 阈值，低于此值就缩小 trust-region
            shrink_ratio: 0.25 # trust-region 缩小比例
            expansion_ratio: 0.75 # trust-region 扩大比例
            shrink_factor: 0.25 # trust-region 缩小因子，低于 acceptance_ratio 时才缩小
            expansion_factor: 2.0 # trust-region 扩大因子，高于 acceptance_ratio 时才扩大
            max_consecutive_rejections: 12 # 连续 rejected trial 超过此值就强制缩小 trust-region
            history_reset_after_rejections: 3 # 连续 rejected trial 超过此值就清空 L-BFGS 历史，避免陷入局部最优
          curvature_relative_threshold: 1.0e-8 # sy > eps*||s||*||y|| 才接受曲率对
          history_acceptance_ratio: 0.25 # 低模型可信度的 accepted step 不写入历史
        min_segment_time: 0.05 # 每段轨迹最短时长（秒），防止时长归零导致数值问题

      environment_validation: # 环境验收：路径与代价地图、方向地形的关系
        samples_per_segment: 20 # 每段空间曲线的碰撞与地形检查采样数下限
        traversal_angle_tolerance: 0.4 # 台阶方向角允许偏差，只记录软诊断（rad）

      speed_profile:
        discretization:
          max_spacing: 0.15 # 平坦区域最大弧长节点间隔 (m)
          step_max_spacing: 0.05 # capability blend 与台阶区域最大节点间隔 (m)
          curvature_refine_threshold: 0.15 # 区间曲率变化超过该值时递归细分 (1/m)
        objective:
          traversal_window: 20.0 # 台阶平方速度窗松弛的弧长积分权重
          global_speed_reward: 0.05 # 无更重要目标时提高平方速度的小权重
          velocity_scale: 2.2 # 平方速度目标的无量纲归一参考速度 (m/s)，保持两类目标权重比例
        validation:
          sample_spacing: 0.025 # 独立物理验收网格间隔 (m)
          velocity_tolerance: 0.02 # 速度硬包络容差 (m/s)
          acceleration_tolerance: 0.05 # 切向加速度容差 (m/s²)
          angular_velocity_tolerance: 0.05 # 角速度容差 (rad/s)
          angular_acceleration_tolerance: 0.10 # 角加速度容差 (rad/s²)
          lateral_acceleration_tolerance: 0.05 # 侧向加速度容差 (m/s²)

      step:
        detection: # 物理边界固定按原始格点 direction magnitude > 0.95 判定
          detect_dot_threshold: 0.5 # 路径方向与台阶方向点积的阈值：大于此值判定为上台阶，小于负的此值判定为下台阶
          path_sample_resolution: 0.05 # 台阶标注弧长采样间距上限；实际不超过方向地图分辨率的一半（米）
        execution:
          profile_prepare_distance: 2.0 # 从 STEPPING/PREPARING 起点到 commit 点的距离，在这段距离内逐步切换底盘能力配置（米）
          chassis_activation_distance: 1.0 # 从 STEPPING/ARMED 起点到 commit 点的距离；开始发送可撤销的台阶提示，commit 前仍可抢占（米）
          fsm_release_distance: 0.3 # 走出物理台阶后，FSM 额外再往前推多远才退出 STEPPING 状态（米）
        mpc_constraints:
          gate_transition_distance: 0.3 # 台阶内部 MPC 约束窗两侧的软门控过渡带宽度（米），让约束逐渐生效而非硬开关

      step_mask:
        path_align_dot_threshold: 0.6 # 路径方向与台阶方向点积 ≥ 此值就认为路径经过了该台阶
        full_effect_radius: 0.6 # 台阶掩码施加满强度的半径（米）
        cutoff_radius: 1.0 # 台阶掩码截止半径（米），超过此范围完全不受影响
        length_num_samples: 100 # 估算路径弧长时的采样点数
