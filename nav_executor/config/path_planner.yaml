/**:
  ros__parameters:
    path_planner:
      endpoint_handling:
        occupied_cost_threshold: 200 # 统一占用阈值；格子代价值 >= 该值视为不可通行（0~255）
        direction_norm_max: 0.1 # 起终点和 nudge 候选处允许的最大方向场模长；用于避开方向地形膨胀区
        nudge_max_distance: 1.0 # 在全局静态地图上搜索可用端点的最大 BFS 半径（米）
        goal_reached_distance: 0.5 # 机器人到最终可执行目标小于该距离时直接判定到达（米）

      dynamic_prediction:
        horizon_seconds: 2.0 # 地形本体动态障碍的逐格 max 预测窗口，0 表示只用当前帧

      directional_terrain:
        min_alignment_cosine: 0.8 # 穿越方向与地形方向的最小绝对余弦；搜索和最终验收共用的硬约束
        runup_transition_distance: 0.1 # run_up 边界外的平滑过渡距离，供参考路径和 MINCO 共用（米）

      search_dynamics: # 仅供参考路径和 Kino A* 构造可达搜索见证；不进入 MINCO 几何目标
        velocity_max: 3.0 # 搜索见证的线速度上限（m/s）
        tangential_acceleration_max: 1.5 # 标量速度变化率 |d speed/dt| 上限（m/s²）
        angular_velocity_max: 6.0 # 角速度上限（rad/s）
        angular_acceleration_max: 7.0 # 角加速度上限（rad/s²）
        lateral_acceleration_max: 2.0 # 侧向加速度 |κ|v² 上限（m/s²）

      geometry: # MINCO、Kino A* 原语和执行速度包络共用的时标不变几何边界
        curvature_max: 4.0 # 最小转弯半径 0.25 m 对应的最大曲率（1/m）
        curvature_rate_max: 8.0 # 曲率在弧长上的最大变化率（1/m²）
        tangent_regularization: 1.0e-6 # 单段归一化参数下的几何切向正则尺度（米）

      spatial_a_star:
        obstacle_weight: 1.0 # 归一化障碍软代价乘数；1.0 表示接近占用阈值时边代价约翻倍
        max_expansions: 1000000 # 二维空间 A* 最大展开数

      reference_path:
        resample_spacing: 0.10 # LOS 平滑后参考路径的最大重采样间距（米）
        tangent_lookahead: 0.30 # 平坦区域参考切向的前后差分距离（米）

      guide_field:
        corridor_width: 1.5 # 参考路径两侧的自由空间测地走廊宽度（米）
        start_bulb_radius: 2.5 # 起点自由空间测地膨胀半径，容纳航向松弛后的掉头与助跑（米）

      kino_a_star:
        lattice:
          xy_resolution: 0.1 # root-relative canonical lattice 位置分辨率（米）
          heading_bins: 80 # canonical 航向数量，80 对应 4.5°
          speed_bin_count: 13 # 离散速度值数量（含 0）；13 对应 0.25 m/s 间隔
        motion_primitives:
          curvature_magnitudes: [1.0, 4.0, 0.25, 1.0, 0.0625, 0.25] # 三个长度带各自的两个 nominal 曲率幅值
          band_lengths: [0.32, 0.63, 1.26] # 与曲率带对应的原语长度（米）
          straight_length: 1.26 # nominal 直行动作长度（米）
        collision_check_resolution: 0.075 # 空间原语碰撞与地形检查的最大步长（米）
        goal_connection_max_distance: 1.0 # 进入该距离后尝试用直线连接真实目标（米）
        guidance_weight: 1.1 # 非 admissible 参考启发的整体 OPEN 排序强度
        deviation_weight: 1.0 # 偏离参考路径的时间等效权重
        heading_weight: 0.25 # 航向偏差权重（秒/rad）
        speed_weight: 0.5 # 参考速度偏差的时间等效权重
        approach_alignment_weight: 4.0 # 助跑区航向横向偏差平方的时间等效权重
        approach_window_weight: 1.0 # 助跑区速度窗偏差平方的时间等效权重
        max_expansions: 500000 # 最大节点展开数，防止搜索时间和内存失控
        start_yaw_relaxation:
          root_count: 6 # 全圆均匀采样的总根数（包含实测 yaw 主根）；1 表示关闭起点航向松弛
          root_bias_seconds: 0.67 # 使用松弛航向根的固定 OPEN 排序偏置（秒）
          yaw_bias_seconds_per_rad: 0.17 # 松弛根相对实测 yaw 每旋转 1 rad 的排序偏置（秒/rad）
          max_discarded_velocity: 0.5 # 实际速度投影到候选航向后允许丢弃的速度分量上限（m/s）

      minco:
        seed:
          max_point_spacing: 0.5 # Kino A* 见证转换为 MINCO 边界时的最大点间距（米）
          max_heading_change: 0.5 # 即使距离较短，航向变化达到该值也保留边界点（rad）
        directed_cosine_min: 0.1 # 曲线切向与种子方向的最小余弦；无速度量纲
        penalty_weights:
          energy: 0.8 # 参数域 min-jerk 正则权重
          time: 12.0 # MINCO 参数区间总长度权重；不进入执行时标
          obstacle: 1000.0 # 障碍物权重，越大越不可能穿墙
          curvature: 100.0 # 几何曲率超限惩罚
          curvature_rate: 100.0 # 弧长曲率变化率超限惩罚
          directed_regularity: 1000.0 # 有向正则性，排除内部零速点、尖点与逆向
          traversal_velocity_window: 2000.0 # runup 起点至地形出口的 MINCO 内部速度见证窗
          traversal_alignment: 2000.0 # runup 起点至地形出口的方向对齐软约束
          prohibited_traversal: 1000.0 # 往地形禁止方向行驶的惩罚
          runup_curvature: 100.0 # runup 起点至地形出口的 κ² 正则
        terrain_gate:
          norm_lo: 0.1 # 方向场模长低于此值时不施加地形软约束
          norm_hi: 0.9 # 方向场模长高于此值时施加完整软约束
        samples_per_segment: 16 # 每段 MINCO 轨迹的约束和惩罚采样数
        runup:
          body_norm_lo: 0.9 # 助跑源门控下界；非本体膨胀 cap=229/255 小于该值
          body_norm_hi: 0.95 # 助跑源门控上界；仅物理本体附近达到完整强度
          saturation_length: 0.05 # 前向地形暴露量的饱和弧长（米）
        max_iterations: 2000 # block-scaled Armijo L-BFGS 最大 accepted step 数
        optimizer:
          position_scale: 0.5 # 每个 2D waypoint block 的物理尺度（米）
          physical_time_scale: 0.1 # 每个 time block 的目标物理尺度（秒）
          max_virtual_time_scale: 20.0 # softplus Jacobian 很小时 virtual-time scale 的上限
          max_function_evaluations: 4000 # 含初始评估及所有 rejected trial
          history_size: 8 # 保留的 L-BFGS (s,y) 对数
          gradient_tolerance: 1.0e-5 # max_block ‖D_b g_b‖₂ 绝对一阶最优性阈值
          cost_window_relative_tolerance: 1.0e-5 # accepted incumbent 窗口首尾的累计相对目标改善阈值
          cost_window_size: 10 # 实际收益判定覆盖的 accepted step 数
          cost_plateau_gradient_tolerance: 1.0e-4 # cost plateau 还须满足的宽松梯度阈值，否则进入恢复
          scaled_step_tolerance: 1.0e-12 # 归一化 block 步长停滞阈值
          step_control:
            initial_step_cap: 0.5 # Armijo 首次试探的最大归一化 block 步长
            min_step_cap: 1.0e-10 # 最小归一化 block 步长上限
            max_step_cap: 2.0 # 最大归一化 block 步长上限
            expansion_min_model_ratio: 0.75 # rho 超过此值的 capped step 才扩大步长上限
            backtrack_factor: 0.25 # Armijo 拒绝后的步长上限回退因子
            expansion_factor: 2.0 # 高可信边界步的 max-step cap 扩大因子
            max_rejections_per_iteration: 20 # 单次 accepted iteration 内的 Armijo 拒绝上限
            recovery_after_rejections: 3 # 达到此次数后切换到归一化负梯度恢复
          curvature_cosine_threshold: 1.0e-8 # sy/(||s||·||y||) 超过此值才接受曲率对
          history_update_min_model_ratio: 0.25 # rho 低于此值的 accepted step 不写入历史
        min_segment_time: 0.05 # 每段 MINCO 参数区间下限；种子与优化统一使用

      trajectory_validation:
        samples_per_segment: 20 # 每段空间曲线的碰撞与方向地形检查采样数下限
        alignment_warning_angle: 0.4 # 穿越方向偏差超过该角度时记录软诊断，不拒绝轨迹（rad）

      traversal_annotation:
        sample_spacing: 0.05 # 方向地形段的弧长采样上限；实际不超过地图分辨率的一半（米）

      speed_profile:
        discretization:
          max_spacing: 0.15 # 平坦区域最大弧长节点间隔（米）
          traversal_max_spacing: 0.05 # capability blend 与方向地形区域最大节点间隔（米）
          curvature_refine_threshold: 0.15 # 区间曲率变化超过该值时递归细分（1/m）
          envelope_sample_spacing: 0.025 # 区间内动力学包络的采样间隔（米）
        objective:
          traversal_window: 20.0 # 方向地形平方速度窗松弛的弧长积分权重
          lateral_acceleration: 18.0 # 侧向加速度超限的弧长积分权重；阈值来自当前 capability
          global_speed_reward: 0.03 # 无更重要目标时提高平方速度的小权重
          velocity_scale: 2.2 # 平方速度目标的无量纲归一参考速度（m/s）
        stationary_velocity_threshold: 0.1 # 小于该值的路径切向初速度按静止处理（m/s）
