/**:
  ros__parameters:
    odometry_estimation:
      # Initialization
      use_init_world_imu: false # If true, parameter init_T_world_imu and init_v_world_imu should be given instead of estimated
      init_pose_damping_scale: 1000000000.0 # Damping scale for the initial pose (to fix the gauge freedom)
      initialization_window_size: 1.0 # Initialization window size [sec]
      naive_initialization: true # If true, skip the graph-based solver and estimate initial attitude by averaging early IMU accelerations (z axis up, position zero)
      align_initial_odom_to_imu: true # If true, after gravity leveling, use the initial IMU x-axis heading to fix the yaw gauge

      # Optimization
      smoother_lag: 3.0 # Fixed-lag smoothing window size [sec]
      use_isam2_dogleg: false # Use the dogleg optimizer as the backend of ISAM2 that is slow but more robust
      isam2_relinearize_skip: 1 # Relinearization is performed every $isam2_relinearize_skip optimization calls
      isam2_relinearize_thresh: 0.01 # Relinearization is performed only when linear delta gets larger than this
      fix_imu_bias: false # If true, disable IMU bias estimation and use the initial IMU bias

      # Registration
      registration_type: "GICP" # Registration type (GICP or VGICP)
      lru_thresh: 100 # LRU cache threshold
      target_downsampling_rate: 0.1 # Downsampling rate for points to be inserted into the target

      # GICP + iVox
      ivox_resolution: 0.5 # iVox resolution
      ivox_min_dist: 0.1 # Minimum distance between points in an iVox cell

      # Delayed target map update & impact pause
      ivox_update_delay: 0.5 # Time delay before inserting frames into target map [sec]
      ivox_impact_pause_duration: 0.5 # Duration to pause target map updates after impact [sec]

      # VGICP
      vgicp_resolution: 0.25 # Voxelmap resolution (for VGICP)
      vgicp_voxelmap_levels: 2 # Multi-resolution voxelmap levels (for VGICP)
      vgicp_voxelmap_scaling_factor: 2.0 # Multi-resolution voxelmap scaling factor (for VGICP)

      # MISC
      num_threads: 6 # Number of threads for odometry estimation