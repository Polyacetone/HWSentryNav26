/**:
  ros__parameters:
    global_mapping:
      # General
      enable_imu: true # If true, create IMU preintegration factors
      enable_optimization: true # If false, do not submap optimization (use only odom data)
      init_pose_damping_scale: 1e10 # Damping scale for initial pose (to fix the gauge freedom)

      # Relative pose factors
      create_between_factors: true # If true, create SE3 relative pose factors between consecutive frames (i.e., odom_factor)
      between_registration_type: "NONE" # Registration factor type for information matrix evaluation of relative pose factors ("NONE" / "GICP")

      # Registration error factors
      registration_error_factor_type: "VGICP" # Registration factor type for matching cost minimization (Only VGICP supported)
      randomsampling_rate: 0.2 # Random sampling rate for registration error factors (1.0 = use all points)
      submap_voxel_resolution: 0.5 # Base voxel resolution of submaps
      submap_voxel_resolution_max: 1.0
      submap_voxel_resolution_dmin: 5.0
      submap_voxel_resolution_dmax: 20.0
      submap_voxelmap_levels: 1 # Multi-resolution voxelmap levels (must be >= 1)
      submap_voxelmap_scaling_factor: 2.0 # Multi-resolution voxelmap scaling factor
      max_implicit_loop_distance: 100.0 # Maximum distance between submaps for factor creation
      min_implicit_loop_overlap: 0.2 # Overlap threshold for factor creation (smaller = more factors)

      # Optimizer
      use_isam2_dogleg: true # If true, use dogleg optimizer (robust but slow)
      isam2_relinearize_skip: 1 # Relinearization is performed every $isam2_relinearize_skip optimization calls
      isam2_relinearize_thresh: 0.1 # Relinearization is performed only when linear delta gets larger than this