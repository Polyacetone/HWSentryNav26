/**:
  ros__parameters:
    terrain_profiles:
      capability_profiles:
        low:
          command_bounds:
            vel_max: 1.5
            vel_min: -0.8
            omega_max: 4.0
            omega_min: -4.0
          motion_constraints:
            acc_max: 1.5
            alpha_max: 7.0
            a_lat_max: 1.2
        medium:
          command_bounds:
            vel_max: 2.0
            vel_min: -1.2
            omega_max: 6.0
            omega_min: -6.0
          motion_constraints:
            acc_max: 1.8
            alpha_max: 7.0
            a_lat_max: 2.0
        high:
          command_bounds:
            vel_max: 2.8
            vel_min: -1.2
            omega_max: 6.0
            omega_min: -6.0
          motion_constraints:
            acc_max: 1.8
            alpha_max: 7.0
            a_lat_max: 2.0

      directional_labels:
        slope:
          up:   { chassis_mode: 7, capability: medium, speed: { min: 1.6, max: 2.0 } }
          down: { chassis_mode: 7, capability: medium, speed: { min: 1.6, max: 2.0 } }
        step_l1:
          up:   { chassis_mode: 4, capability: low, speed: { min: 1.2, max: 1.5 } }
          down: { chassis_mode: 7, capability: medium, speed: { min: 1.6, max: 2.0 } }
        step_l2:
          up:   { chassis_mode: 4, capability: low, speed: { min: 1.2, max: 1.5 } }
          down: { chassis_mode: 9, capability: medium, speed: { min: 1.6, max: 2.0 } }
        fly_slope:
          up:   { chassis_mode: 10, capability: high, speed: { min: 2.8, max: 3.0 } }
          down: { chassis_mode: 11, capability: medium, speed: { min: 1.8, max: 2.0 } }
        step_high:
          up:   { chassis_mode: 6, capability: medium, speed: { min: 1.8, max: 2.0 } }
          down: { chassis_mode: 9, capability: medium, speed: { min: 1.8, max: 2.0 } }
