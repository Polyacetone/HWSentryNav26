/**:
  ros__parameters:
    control_points_sub_topic: "/path_planner/control_points" # B样条控制点
    global_direction_map_sub_topic: "/map_server/global_direction_map" # 全局台阶地图（8UC3: B=方向X, G=方向Y, A=台阶模式alpha）
    global_cost_map_sub_topic: "/map_server/global_cost_map" # 全局代价地图（OccupancyGrid）
    local_cost_maps_sub_topic: "/map_server/local_cost_maps" # 局部代价地图序列（maps[0]=当前帧，maps[1..N]=预测帧）
    comp_stage_sub_topic: "/serial_bridge/comp_stage" # 比赛阶段
    chassis_status_sub_topic: "/serial_bridge/chassis_status" # 底盘状态（速度、腿模式等）
    spin_cmd_sub_topic: "/decision/spin_cmd" # 小陀螺指令
    chassis_cmd_pub_topic: "/path_follower/chassis_cmd" # 底盘控制指令（velocity + omega + mode）
    follower_state_pub_topic: "/path_follower/state" # 跟随器FSM状态
    replan_trigger_pub_topic: "/path_follower/replan_trigger" # 助跑完成后触发 path_planner 立即重规划

    debug:
      enable: true # 是否启用调试发布
      predicted_path_pub_topic: "/path_follower/debug/predicted_path" # MPC预测路径
      step_rollout_path_pub_topic: "/path_follower/debug/step_rollout_path" # 台阶检测/助跑长时域预测路径
      v_pred_pub_topic: "/path_follower/debug/v_pred" # MPC预测线速度序列
      w_pred_pub_topic: "/path_follower/debug/w_pred" # MPC预测角速度序列
      final_cost_map_pub_topic: "/path_follower/debug/final_cost_map" # 最终融合代价地图

    misc:
      stop_threshold_dist: 0.5 # 到达目标判定距离 (m)
      stop_threshold_u: 0.99 # 到达目标判定样条参数u
      remaining_energy_filter_alpha: 0.5 # 电容剩余电量一阶惯性滤波系数 (0,1]，越小越平滑

    step_mask:
      path_align_dot_threshold: 0.6 # 路径切向与台阶方向点积 >= 该值，认为路径经过台阶（触发掩码软擦除）
      full_effect_radius: 0.4 # 掩码满强度半径 (m)：<= 该距离内 alpha=1（cost 全擦除，dir 全保留）
      cutoff_radius: 0.8 # 掩码截止半径 (m)：>= 该距离内 alpha=0（cost 全保留，dir 全擦除）
      length_num_samples: 100 # 路径弧长估计采样数
      cost_max: 240.0 # 投影连线最大障碍物代价 > 该值则取消follow (0~255)
      cost_samples: 20 # 连线代价估计采样数

    follow_no_progress_guard:
      landmark_spacing: 1.0 # 路标点沿弧长间隔 (m)
      timeout: 6.0 # 无进度超时 (s)

    follow_step_block_replan:
      enable: true # 是否启用“台阶被动态障碍物堵住”检测并触发全局重规划
      lookahead_distance: 5.0 # 沿当前全局路径向前检查距离 (m)
      sample_resolution: 0.2 # 非预测地图模式下的路径采样分辨率 (m)
      step_norm_threshold: 0.9 # 方向场模长 >= 该值视为路径经过台阶区域
      obstacle_cost_threshold: 100.0 # 动态障碍物代价值 >= 该值视为被障碍物占据
      predicted_obstacle_ratio_threshold: 0.8 # 预测地图模式下，台阶样本中被占据比例超过该阈值则触发重规划

    step:
      step_dist_offset: 0.1 # 补偿代价地图膨胀的台阶距离偏移量 (m)，正值增加报告距离
      detection:
        detect_norm_threshold: 0.9 # 方向场模长 >= 该值认为进入台阶区域；从进入点起继续搜索首个 < 该值的位置作为台阶尾部
        detect_dot_threshold: 0.5 # 路径切向与台阶方向点积阈值；>阈值为上台阶，< -阈值为下台阶
        path_sample_resolution: 0.05 # 沿路径采样分辨率 (m)
        target_match_distance: 0.4 # 连续检测视为同一台阶目标的位置阈值 (m)
        rollout_match_distance: 0.8 # rollout 扫到的台阶与当前锁存目标匹配的位置阈值 (m)
        latch_threshold: 3 # 连续检测到同一台阶目标的次数阈值，超过才锁存
        lookahead:
          rollout_length_filter_alpha: 0.2 # 跟随 rollout 长度的一阶惯性滤波系数
          fixed_extension_distance: 0.5 # 在滤波 rollout 长度基础上额外增加的固定前瞻距离 (m)
          min_distance: 2.0 # lookahead_distance 最小值 (m)
      runup:
        velocity_deficit_threshold: 0.4 # 上台阶预测速度赤字超过该值则触发助跑 (m/s)
        goal_tolerance: 0.2 # 助跑点到达判定距离 (m)
        mpc_weights:
          tracking:
            q_y: 0.5 # 横向误差权重
            q_theta: 0.2 # 航向误差权重
            q_u: 1.0 # 进度项权重（鼓励沿路径前进）
          command:
            r_dv: 0.2 # 线速度平滑
            r_domega: 0.1 # 角速度平滑
          motion:
            acc_limit: 20.0 # 速度变化率约束惩罚
            alpha_limit: 20.0 # 角速度变化率约束惩罚
            lat_acc: 20.0 # 侧向稳定性惩罚
        search:
          radius_min: 2.0 # 助跑点搜索半径下界 (m)
          radius_max: 3.0 # 助跑点搜索半径上界 (m)
          radius_samples: 8 # 助跑点搜索半径采样数
          sector_half_angle_rad: 0.4 # 以背离台阶方向为中心的采样扇区半角 (rad)
          angle_samples: 13 # 扇区角度采样数
          candidate_cost_max: 40.0 # 候选点代价上限
          line_cost_max: 80.0 # 到助跑点连线的最大允许代价
          safe_step_norm_threshold: 0.1 # 候选点方向场模长上限，避免落在台阶区
          path_integral_resolution: 0.05 # 连线路径积分采样精度 (m)
          path_integral_cost_weight: 1.0 # 路径积分中 cost 权重
          path_integral_step_weight: 3.0 # 路径积分中台阶方向场权重
          radius_preference_weight: 0.6 # 偏离理想助跑距离的惩罚权重

    state_machine:
      follow_to_spin_vel_max: 0.2 # STOPPING→SPIN 退出判定：|v_cmd| < 该值 (m/s)
      spin_to_follow_omega_max: 0.6 # STOPPING→FOLLOW 退出判定：|omega_cmd| < 该值 (rad/s)
      to_idle_vel_max: 0.2 # STOPPING→IDLE/FIXED 退出判定：|v_cmd| < 该值 (m/s)
      to_idle_omega_max: 0.6 # STOPPING→IDLE/FIXED 退出判定：|omega_cmd| < 该值 (rad/s)
      stopping_timeout: 1.0 # STOPPING 状态超时 (s)，超时强制切出
      wait_replan_timeout: 2.0 # WAIT_REPLAN 最长等待有效新路径时间 (s)

    mpc:
      energy:
        enable: true # 是否启用能量约束（电容电量不足时限制功率）
        threshold: 600.0 # 电容能量惩罚阈值 (J)，低于此值开始惩罚
        weight: 6.0 # 能量软约束权重
        softplus_beta: 20.0 # softplus斜率，越大越接近硬折线惩罚
      multi_hypothesis:
        enable: false # 是否启用多假设求解（左/右偏移的备选路径）
        lateral_offset: 1.0 # 横向偏移量 (m)
        target_ey_penalty: 1.0 # 非中心target_ey的固定附加代价系数

      follow:
        start_command:
          vel_cmd_act_gap_max: 1.5 # 线速度指令与实际允许差值上限 (m/s)
          omega_cmd_act_gap_max: 3.0 # 角速度指令与实际允许差值上限 (rad/s)
        mode_profiles:
          normal:
            command_bounds:
              vel_max: 2.4 # 线速度上限 (m/s)
              vel_min: -1.2 # 线速度下限 (m/s）
              omega_max: 7.2 # 角速度上限 (rad/s)
              omega_min: -7.2 # 角速度下限 (rad/s)
            motion_constraints:
              acc_max: 1.8  # 最大 dv_cmd/dt (m/s²)
              alpha_max: 7.0 # 最大 domega_cmd/dt (rad/s²)
              a_lat_max: 2.8 # 最大侧向加速度 |v_act*omega_act| (m/s²)
            lpv_rho: -0.87 # 常规构型调度量
          up:
            jump:
              command_bounds:
                vel_max: 2.4 # 线速度上限 (m/s)
                vel_min: -1.2 # 线速度下限 (m/s）
                omega_max: 7.2 # 角速度上限 (rad/s)
                omega_min: -7.2 # 角速度下限 (rad/s)
              motion_constraints:
                acc_max: 1.8 # 最大 dv_cmd/dt (m/s²)
                alpha_max: 7.0 # 最大 domega_cmd/dt (rad/s²)
                a_lat_max: 2.8 # 最大侧向加速度 |v_act*omega_act| (m/s²)
              lpv_rho: -0.87 # 跳跃上台阶构型调度量
            short_leg:
              command_bounds:
                vel_max: 2.4 # 线速度上限 (m/s)
                vel_min: -1.2 # 线速度下限 (m/s）
                omega_max: 7.2 # 角速度上限 (rad/s)
                omega_min: -7.2 # 角速度下限 (rad/s)
              motion_constraints:
                acc_max: 1.8 # 最大 dv_cmd/dt (m/s²)
                alpha_max: 7.0 # 最大 domega_cmd/dt (rad/s²)
                a_lat_max: 2.2 # 最大侧向加速度 |v_act*omega_act| (m/s²)
              lpv_rho: -0.16 # 短伸腿上台阶构型调度量
            long_leg:
              command_bounds:
                vel_max: 1.5 # 线速度上限 (m/s)
                vel_min: -1.2 # 线速度下限 (m/s）
                omega_max: 7.2 # 角速度上限 (rad/s)
                omega_min: -7.2 # 角速度下限 (rad/s)
              motion_constraints:
                acc_max: 1.5 # 最大 dv_cmd/dt (m/s²)
                alpha_max: 7.0 # 最大 domega_cmd/dt (rad/s²)
                a_lat_max: 1.5 # 最大侧向加速度 |v_act*omega_act| (m/s²)
              lpv_rho: 0.95 # 长伸腿上台阶构型调度量（待标定）
          down:
            jump:
              command_bounds:
                vel_max: 2.4 # 线速度上限 (m/s)
                vel_min: -1.2 # 线速度下限 (m/s）
                omega_max: 7.2 # 角速度上限 (rad/s)
                omega_min: -7.2 # 角速度下限 (rad/s)
              motion_constraints:
                acc_max: 1.8 # 最大 dv_cmd/dt (m/s²)
                alpha_max: 7.0 # 最大 domega_cmd/dt (rad/s²)
                a_lat_max: 2.2 # 最大侧向加速度 |v_act*omega_act| (m/s²)
              lpv_rho: -0.16 # 跳跃下台阶构型调度量
            short_leg:
              command_bounds:
                vel_max: 2.8 # 线速度上限 (m/s)
                vel_min: -1.2 # 线速度下限 (m/s）
                omega_max: 7.2 # 角速度上限 (rad/s)
                omega_min: -7.2 # 角速度下限 (rad/s)
              motion_constraints:
                acc_max: 1.8 # 最大 dv_cmd/dt (m/s²)
                alpha_max: 7.0 # 最大 domega_cmd/dt (rad/s²)
                a_lat_max: 2.2 # 最大侧向加速度 |v_act*omega_act| (m/s²)
              lpv_rho: -0.16 # 短伸腿下台阶构型调度量
        tracking_weights:
          q_y: 0.4  # 横向误差权重
          q_theta: 0.2 # 航向误差权重
          q_u: 1.0  # 进度项权重（鼓励沿路径前进）
        command_weights:
          r_v: 0.01 # 线速度正则
          r_omega: 0.01 # 角速度正则
          r_dv: 0.8 # 线速度平滑
          r_domega: 0.4 # 角速度平滑
        motion_constraint_weights:
          acc_limit: 20.0 # 速度指令变化率超限惩罚
          alpha_limit: 20.0 # 角速度指令变化率超限惩罚
          lat_acc: 20.0 # 侧向稳定性惩罚（|v_act*omega_act| 超限）
        terrain_limits:
          step_speed_levels: [1.0, 1.6, 2.2, 2.8] # alpha中4档速度映射为实际速度 (m/s)，对应00/01/10/11
          step_vel_deadzone: 0.2 # 台阶速度惩罚死区，|v_act - target_v| < deadzone 时不惩罚
        terrain_weights:
          step_vel_weight: 2.0 # 锁存后台阶区域速度目标惩罚权重
          direction: 1.5 # 台阶方向对齐权重（鼓励与方向场同向）
        environment_weights:
          obstacle: 1.0 # 避障权重（全局+局部融合代价）
        terminal_limits:
          slow_down_deceleration: 2.5 # 终点减速期望加速度 (m/s²)
          slow_down_target_vel: 0.3 # 终点减速目标速度 (m/s)
          slow_down_num_samples: 12 # 剩余弧长估计的积分采样数
        terminal_weights:
          q_v_final: 0.2 # 终点减速权重（鼓励到达终点时减速）
        projection:
          num_samples: 50 # 投影到样条参数u的采样数
          search_window: 0.1 # 局部搜索窗口 (0~1)
          local_search_lazy_distance: 0.1 # 局部搜索找到合适投影点的距离阈值 (m)

      stop:
        command_bounds:
          vel_max: 2.8 # 线速度上限 (m/s)
          vel_min: 0.0  # 线速度下限 (m/s）
          omega_max: 12.5 # 角速度上限 (rad/s)
          omega_min: -12.5 # 角速度下限 (rad/s)
        start_command:
          vel_cmd_act_gap_max: 1.5 # 线速度指令与实际允许差值上限 (m/s)
          omega_cmd_act_gap_max: 3.0 # 角速度指令与实际允许差值上限 (rad/s)
        motion_constraints:
          acc_max: 1.8 # 最大 dv_cmd/dt (m/s²)
          alpha_max: 7.0 # 最大 domega_cmd/dt (rad/s²)
          a_lat_max: 2.4 # 最大侧向加速度 |v_act*omega_act| (m/s²)
        command_weights:
          q_v: 0.6 # 线速度正则
          q_omega: 0.6 # 角速度正则
          r_dv: 0.8 # 线速度指令平滑
          r_domega: 0.2 # 角速度指令平滑
        motion_constraint_weights:
          acc_limit: 20.0 # 速度指令变化率超限惩罚
          alpha_limit: 20.0 # 角速度指令变化率超限惩罚
          lat_acc: 20.0 # 侧向稳定性惩罚（|v_act*omega_act| 超限）
        environment_weights:
          obstacle: 6.0 # 避障惩罚（台阶区域已转为障碍物）
        terminal_weights:
          obstacle_terminal: 10.0 # 终端避障惩罚（防止停在障碍上）

      hold:
        command_bounds:
          vel_max: 1.2 # 线速度上限 (m/s)
          vel_min: -1.2 # 线速度下限 (m/s）
          omega_max: 1.6 # 角速度上限 (rad/s)
          omega_min: -1.6 # 角速度下限 (rad/s)
        start_command:
          vel_cmd_act_gap_max: 1.5 # 线速度指令与实际允许差值上限 (m/s)
          omega_cmd_act_gap_max: 3.0 # 角速度指令与实际允许差值上限 (rad/s)
        motion_constraints:
          acc_max: 1.8 # 最大 dv_cmd/dt (m/s²)
          alpha_max: 7.0 # 最大 domega_cmd/dt (rad/s²)
          a_lat_max: 2.4 # 最大侧向加速度 |v_act*omega_act| (m/s²)
        goal_weights:
          q_goal_xy: 0.3 # 每步目标点吸引（x/y误差）
          q_goal_theta: 0.2 # 朝向目标点
          goal_deadzone: 0.2 # 目标吸引死区半径，进入后不再因目标位置误差来回抽动 (m)
        command_weights:
          r_v: 0.02 # 线速度正则
          r_omega: 0.08 # 角速度正则
          r_dv: 0.8 # 线速度指令平滑
          r_domega: 0.2 # 角速度指令平滑
        motion_constraint_weights:
          acc_limit: 20.0 # 速度指令变化率超限惩罚
          alpha_limit: 20.0 # 角速度指令变化率超限惩罚
          lat_acc: 20.0 # 侧向稳定性惩罚（|v_act*omega_act| 超限）
        environment_weights:
          obstacle: 6.0 # 全程避障惩罚
          step: 6.0 # 全程台阶惩罚（视为不可通行）
        terminal_weights:
          q_goal_xy_terminal: 3.0 # 终端目标点吸引
          obstacle_terminal: 12.0 # 终端避障惩罚
          step_terminal: 12.0 # 终端台阶惩罚

    recovery:
      hazard:
        cost_threshold: 30.0 # 当前位置代价 >= 该值认为在危险区域 (0~255)
        step_norm_threshold: 0.06 # 当前位置方向场模长 >= 该值认为在危险台阶区域
      safe:
        cost_threshold: 5.0 # 当前位置代价 < 该值认为可通行
        step_norm_threshold: 0.01 # 当前位置方向场模长 < 该值认为可通行
      search:
        recovery_cost_threshold: 20.0 # 候选点插值代价上限，超过则不作为恢复目标
        radius_min: 0.5 # 搜索半径下界 (m)
        radius_max: 1.5 # 搜索半径上界 (m)
        radius_samples: 5 # 半径采样数
        angle_samples: 36 # 角度采样数
        path_integral_resolution: 0.05 # 路径积分采样精度 (m)
        goal_timeout: 4.0 # 目标点超时 (s)，超时后重新搜索
      exit:
        safe_hold_time: 1.0 # 安全区域保持时间，超过后才退出恢复 (s)
      stuck:
        cmd_vel_threshold: 0.4 # 指令速度超过该值才开始检测 (m/s)
        timeout: 2.0 # 卡住判定持续时间阈值 (s)
        max_displacement: 0.2 # 位移小于该值判定卡住 (m)
        reverse_speed: 0.5 # 倒车速度 (m/s)
        reverse_duration: 2.0 # 倒车持续时间 (s)
