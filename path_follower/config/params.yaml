/**:
  ros__parameters:
    control_points_sub_topic: "/path_planner/control_points"
    global_direction_map_sub_topic: "/map_server/global_direction_map"
    global_cost_map_sub_topic: "/map_server/global_cost_map"
    local_cost_map_sub_topic: "/map_server/local_cost_map"
    chassis_status_sub_topic: "/serial/chassis_status"
    spin_cmd_sub_topic: "/decision/spin_cmd"
    chassis_cmd_pub_topic: "/path_follower/chassis_cmd"
    stop_threshold: 0.99 # 停止阈值 (u参数化路径)

    debug:
      enable: true
      predicted_path_pub_topic: "/path_follower/debug/predicted_path"

    step_ahead:
      window_back: 0.1 # 当前在全局路径上的后方窗口 (m)
      window_front: 1.2 # 当前在全局路径上的前方窗口 (m)
      sample_step: 0.05 # 沿样条弧长采样间隔 (m)

    spin_switch:
      vel_to_spin_threshold: 0.1 # 切到小陀螺前，线速度需小于该阈值 (m/s)
      omega_to_follow_threshold: 6.0 # 从小陀螺回到跟随前，角速度需小于该阈值 (rad/s)

    mpc:
      general: # 通用参数
        horizon: 10 # 预测步数
        dt: 0.1 # 预测时间间隔
        max_iterations: 100 # 最大迭代次数
      follow_path: # 路径跟随模式
        projection: # 投影参数
          num_samples: 50 # 投影到样条参数u时的采样数
          search_window: 0.1 # 局部搜索窗口大小（0~1）
          max_correspondence_distance: 1.0 # 最大对应点距离 (m)
        limits: # 运动限制
          vel_max: 2.8 # 最大速度 (m/s)
          vel_min: 0.1 # 最小速度 (m/s)
          omega_max: 7.2 # 最大角速度 (rad/s)
          omega_min: -7.2 # 最小角速度 (rad/s)
          acc_max: 2.5 # 最大加速度 (m/s²)
          alpha_max: 7.2 # 最大角加速度 (rad/s²)
          vel_max_on_step: 1.0 # 台阶区域最大速度 (m/s)
          v_omega_product_max: 3.5 # |v*omega| 最大值软约束 (m/s * rad/s)
          slow_down_distance: 1.0 # 距离终点剩余弧长小于该值时开始减速 (m)
          slow_down_num_samples: 12 # 剩余弧长估计的积分采样数
        weights: # 权重
          q_y: 0.4 # 横向误差权重
          q_theta: 0.1 # 航向误差权重
          q_u: 1.0 # 进度项权重
          q_v_final: 0.3 # 终点减速权重
          r_v: 0.03 # 线速度正则
          r_omega: 0.03 # 角速度正则
          r_dv: 0.1 # 线速度平滑
          r_domega: 0.1 # 角速度平滑
          acc_limit: 10.0 # 超过加速度上限的惩罚
          alpha_limit: 10.0 # 超过角加速度上限的惩罚
          vel_max_on_step: 3.0 # 台阶区域限速权重
          v_omega_product: 10.0 # 超过 |v*omega| 上限的惩罚
          obstacle: 2.0 # 避障权重（全局+局部）
          direction: 2.0 # 台阶方向对齐权重
      stop: # 停止模式
        limits: # 运动限制
          vel_max: 2.8 # 最大线速度硬约束 (m/s)
          omega_max: 7.2 # 最大角速度硬约束 (rad/s)
          omega_min: -7.2 # 最小角速度硬约束 (rad/s)
          acc_max: 2.5 # 最大加速度软约束 (m/s²)
          alpha_max: 7.2 # 最大角加速度软约束 (rad/s²)
          vel_max_on_step: 1.0 # 台阶区域最大速度软约束 (m/s)
          v_omega_product_max: 3.5 # |v*omega| 最大值软约束 (m/s * rad/s)
          step_exit_speed_min: 0.8 # 在台阶上时，为退出台阶要求的最小线速度 (m/s)
        weights: # 权重
          q_v: 0.3 # 线速度正则
          q_omega: 0.3 # 角速度正则
          acc_limit: 10.0 # 超过加速度上限惩罚
          alpha_limit: 10.0 # 超过角加速度上限惩罚
          vel_max_on_step: 3.0 # 台阶区域限速惩罚
          v_omega_product: 10.0 # 超过 |v*omega| 上限惩罚
          obstacle: 2.0 # 避障惩罚
          obstacle_terminal: 6.0 # 终端避障惩罚（防止停在障碍上）
          direction: 2.0 # 在台阶上要求朝向与台阶方向对齐
          step_exit: 6.0 # 在台阶上不允许停下（推动退出台阶）
          step_terminal: 6.0 # 终端台阶惩罚（防止停在台阶上）