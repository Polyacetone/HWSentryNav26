/**:
  ros__parameters:
    control_points_sub_topic: "/path_planner/control_points"
    global_direction_map_sub_topic: "/map_server/global_direction_map"
    global_cost_map_sub_topic: "/map_server/global_cost_map"
    local_cost_map_sub_topic: "/map_server/local_cost_map"
    comp_stage_sub_topic: "/serial_bridge/comp_stage"
    chassis_status_sub_topic: "/serial_bridge/chassis_status"
    spin_cmd_sub_topic: "/decision/spin_cmd"
    chassis_cmd_pub_topic: "/path_follower/chassis_cmd"

    debug:
      enable: true
      predicted_path_pub_topic: "/path_follower/debug/predicted_path"
      v_pred_pub_topic: "/path_follower/debug/v_pred"
      w_pred_pub_topic: "/path_follower/debug/w_pred"

    misc:
      stop_threshold_dist: 0.5 # 停止距离 (m)
      stop_threshold_u: 0.99 # 停止样条参数u (0~1)
      remaining_energy_filter_alpha: 0.5 # 电容剩余电量一阶惯性滤波系数 (0,1]，越小越平滑

    step_ahead_flag: # 台阶标志位参数（基于MPC预测轨迹 + 防抖）
      detect_norm_threshold: 0.9 # 方向场模长阈值，>=该值认为经过台阶
      detect_dot_threshold: 0.5 # 朝向与方向场点积阈值，用于区分上/下台阶
      on_count_threshold: 2 # 连续检测到台阶的次数才设置标志位
      off_count_threshold: 2 # 连续未检测到台阶的次数才取消标志位

    state_machine: # 控制状态机参数
      follow_to_spin_vel_max: 0.2 # 从路径跟随切到小陀螺前，线速度需小于该阈值 (m/s)
      spin_to_follow_omega_max: 1.0 # 从小陀螺切到路径跟随前，角速度需小于该阈值 (rad/s)
      to_idle_vel_max: 0.2 # 切到空闲前，线速度需小于该阈值 (m/s)
      to_idle_omega_max: 0.2 # 切到空闲前，角速度需小于该阈值 (rad/s)

    mpc: # MPC控制器参数
      energy: # 能量感知参数
        enable: true # 是否启用能量约束
        threshold: 500.0 # 电容能量惩罚阈值(J)，低于此值开始惩罚
        weight: 5.0 # 能量软约束权重
        softplus_beta: 5.0 # softplus斜率(越大越接近硬折线惩罚)
      follow_path: # 路径跟随模式
        projection: # 投影参数
          num_samples: 50 # 投影到样条参数u时的采样数
          search_window: 0.1 # 局部搜索窗口大小 (0~1)
          max_correspondence_distance: 1.0 # 最大对应点距离 (m)
        limits: # 运动限制
          vel_max: 1.5 # 最大速度 (m/s)
          vel_min: 0.1 # 最小速度 (m/s)
          omega_max: 7.2 # 最大角速度 (rad/s)
          omega_min: -7.2 # 最小角速度 (rad/s)
          start_vel_cmd_act_diff_max: 1.5 # 起始速度指令与实际速度差最大值 (m/s)，该值应当大于最大加速度*控制周期时长
          start_omega_cmd_act_diff_max: 3.0 # 起始角速度指令与实际角速度差最大值 (rad/s)，该值应当大于最大角加速度*控制周期时长
          acc_max: 2.4 # 指令变化率限制：最大 dv_cmd/dt (m/s²)
          alpha_max: 7.0 # 指令变化率限制：最大 domega_cmd/dt (rad/s²)
          vel_step_up: 1.0 # 上台阶期望速度 (m/s)
          vel_step_down: 1.0 # 下台阶期望速度 (m/s)
          a_lat_max: 3.0 # 侧向加速度限制：|v_act*omega_act| (m/s²)
          slow_down_deceleration: 2.5 # 终点减速期望加速度 (m/s²)
          slow_down_num_samples: 12 # 剩余弧长估计的积分采样数
          step_norm_threshold: 0.01 # 台阶方向场模长阈值：>=该值认为进入台阶区域
          step_norm_transition: 0.05 # smoothstep过渡宽度
        weights: # 权重
          q_y: 0.5 # 横向误差权重
          q_theta: 0.3 # 航向误差权重
          q_u: 2.0 # 进度项权重
          q_v_final: 0.4 # 终点减速权重
          r_v: 0.01 # 线速度正则
          r_omega: 0.06 # 角速度正则
          r_dv: 0.8 # 线速度平滑
          r_domega: 0.2 # 角速度平滑
          acc_limit: 10.0 # 速度指令变化率超限惩罚
          alpha_limit: 10.0 # 角速度指令变化率超限惩罚
          lat_acc: 10.0 # 侧向稳定性惩罚（|v_act*omega_act| 超限）
          vel_on_step: 0.0 # 台阶区域速度保持权重
          obstacle: 3.0 # 避障权重（全局+局部）
          direction: 3.0 # 台阶方向对齐权重
          step: 0.01 # 经过台阶惩罚
      stop: # 停止模式
        limits: # 运动限制
          vel_max: 1.5 # 最大线速度硬约束 (m/s)
          omega_max: 12.5 # 最大角速度硬约束 (rad/s)
          omega_min: -12.5 # 最小角速度硬约束 (rad/s)
          start_vel_cmd_act_diff_max: 1.5 # 起始速度指令与实际速度差最大值 (m/s)，该值应当大于最大加速度*控制周期时长
          start_omega_cmd_act_diff_max: 3.0 # 起始角速度指令与实际角速度差最大值 (rad/s)，该值应当大于最大角加速度*控制周期时长
          acc_max: 2.4 # 指令变化率限制：最大 dv_cmd/dt (m/s²)
          alpha_max: 7.0 # 指令变化率限制：最大 domega_cmd/dt (rad/s²)
          vel_step_up: 1.0 # 上台阶期望速度 (m/s)
          vel_step_down: 1.0 # 下台阶期望速度 (m/s)
          a_lat_max: 3.0 # 侧向加速度限制：|v_act*omega_act| (m/s²)
          step_norm_threshold: 0.01 # 台阶方向场模长阈值：>=该值认为进入台阶区域
          step_norm_transition: 0.05 # smoothstep过渡宽度
        weights: # 权重
          q_v: 0.6 # 线速度正则
          q_omega: 0.6 # 角速度正则
          r_dv: 0.8 # 线速度指令平滑
          r_domega: 0.2 # 角速度指令平滑
          acc_limit: 10.0 # 速度指令变化率超限惩罚
          alpha_limit: 10.0 # 角速度指令变化率超限惩罚
          lat_acc: 10.0 # 侧向稳定性惩罚（|v_act*omega_act| 超限）
          vel_on_step: 6.0 # 台阶区域速度保持权重
          obstacle: 6.0 # 避障惩罚
          obstacle_terminal: 10.0 # 终端避障惩罚（防止停在障碍上）
          direction: 3.0 # 在台阶上要求朝向与台阶方向对齐
          step_terminal: 10.0 # 终端台阶惩罚（防止停在台阶上）
      recovery: # 恢复模式（向安全点移动）
        limits:
          vel_max: 0.5 # 最大线速度硬约束 (m/s)
          vel_min: -0.5 # 最小线速度硬约束 (m/s)
          omega_max: 1.0 # 最大角速度硬约束 (rad/s)
          omega_min: -1.0 # 最小角速度硬约束 (rad/s)
          start_vel_cmd_act_diff_max: 1.5 # 起始速度指令与实际速度差最大值 (m/s)，该值应当大于最大加速度*控制周期时长
          start_omega_cmd_act_diff_max: 3.0 # 起始角速度指令与实际角速度差最大值 (rad/s)，该值应当大于最大角加速度*控制周期时长
          acc_max: 2.4 # 指令变化率限制：最大 dv_cmd/dt (m/s²)
          alpha_max: 7.0 # 指令变化率限制：最大 domega_cmd/dt (rad/s²)
          a_lat_max: 3.0 # 侧向加速度限制：|v_act*omega_act| (m/s²)
          step_norm_threshold: 0.01 # 台阶方向场模长阈值：>=该值认为进入台阶区域
          step_norm_transition: 0.05 # smoothstep过渡宽度
        weights: # 权重
          q_goal_xy: 0.2 # 每步目标点吸引（x/y误差）
          q_goal_theta: 0.1 # 朝向目标点
          r_v: 0.02 # 线速度正则
          r_omega: 0.12 # 角速度正则
          r_dv: 0.80 # 线速度平滑
          r_domega: 0.20 # 角速度平滑
          acc_limit: 10.0 # 速度指令变化率超限惩罚
          alpha_limit: 10.0 # 角速度指令变化率超限惩罚
          lat_acc: 10.0 # 侧向稳定性惩罚（|v_act*omega_act| 超限）
          obstacle: 6.0 # 全程避障惩罚
          step: 6.0 # 全程台阶惩罚（视为不可通行）
          q_goal_xy_terminal: 3.0 # 终端目标点吸引（x/y误差）
          obstacle_terminal: 12.0 # 终端避障惩罚
          step_terminal: 12.0 # 终端台阶惩罚

    recovery:
      enable: true # 是否启用恢复功能
      hazard:
        cost_threshold: 30.0 # >= 认为在危险区域 (0~255)
        step_norm_threshold: 0.06 # >= 认为在危险台阶区域
      safe:
        cost_threshold: 5.0 # < 认为可通行
        step_norm_threshold: 0.01 # < 认为可通行
      search:
        circ_radius: 1.0 # 圆搜索法半径 (m)
        circ_angle_samples: 36 # 圆搜索法半径环采样角度数
        circ_radius_samples: 20 # 圆搜索法每条半径上用于计算代价和的采样数
        goal_timeout: 5.0 # 目标点未更新超时 (s)
      exit:
        goal_reached_dist: 0.5 # 到达目标点距离阈值 (m)
        safe_hold_time: 0.3 # 安全区域保持时间 (s)
      stuck:
        enable: true # 是否启用卡住检测
        cmd_vel_threshold: 0.09 # 指令速度超过该值才开始检测 (m/s)
        timeout: 5.0 # 持续时间阈值 (s)
        max_displacement: 0.1 # 位移小于该值则判定卡住 (m)
        reverse_speed: 0.6 # 倒车速度 (m/s)
        reverse_duration: 1.0 # 倒车时间 (s)