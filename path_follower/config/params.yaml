/**:
  ros__parameters:
    control_points_sub_topic: "/path_planner/control_points"
    global_direction_map_sub_topic: "/map_server/global_direction_map"
    global_cost_map_sub_topic: "/map_server/global_cost_map"
    local_cost_map_sub_topic: "/map_server/local_cost_map"
    chassis_status_sub_topic: "/serial_bridge/chassis_status"
    spin_cmd_sub_topic: "/decision/spin_cmd"
    chassis_cmd_pub_topic: "/path_follower/chassis_cmd"
    stop_threshold: 0.99 # 停止阈值 (u参数化路径)

    debug:
      enable: true
      predicted_path_pub_topic: "/path_follower/debug/predicted_path"

    step_ahead_flag: # 台阶标志位参数
      window_back: 0.1 # 当前在全局路径上的后方窗口 (m)
      window_front: 1.0 # 当前在全局路径上的前方窗口 (m)
      sample_step: 0.05 # 沿样条弧长采样间隔 (m)

    control_fsm: # 控制状态机参数
      follow_to_spin_vel_max: 0.2 # 从路径跟随切到小陀螺前，线速度需小于该阈值 (m/s)
      spin_to_follow_omega_max: 4.0 # 从小陀螺切到路径跟随前，角速度需小于该阈值 (rad/s)
      to_idle_vel_max: 0.2 # 切到空闲前，线速度需小于该阈值 (m/s)
      to_idle_omega_max: 0.2 # 切到空闲前，角速度需小于该阈值 (rad/s)

    mpc: # MPC控制器参数
      general: # 通用参数
        horizon: 12 # 预测步数
        dt: 0.1 # 预测时间间隔
        max_iterations: 40 # 最大迭代次数
      lqr: # LQR预测相关参数，A/B/K矩阵见lqr_matrix.yaml
        dt: 0.001 # LQR小步时长(s)，用于计算每个子步包含多少个LQR小步
        substeps: 10 # 单步MPC内的LQR子步数
      follow_path: # 路径跟随模式
        projection: # 投影参数
          num_samples: 50 # 投影到样条参数u时的采样数
          search_window: 0.1 # 局部搜索窗口大小（0~1）
          max_correspondence_distance: 1.0 # 最大对应点距离 (m)
        limits: # 运动限制
          vel_max: 2.0 # 最大速度 (m/s)
          vel_min: 0.1 # 最小速度 (m/s)
          omega_max: 7.2 # 最大角速度 (rad/s)
          omega_min: -7.2 # 最小角速度 (rad/s)
          acc_max: 2.5 # 指令变化率限制：最大 dv_cmd/dt (m/s²)
          alpha_max: 12.0 # 指令变化率限制：最大 domega_cmd/dt (rad/s²)
          phys_acc_max: 2.5 # 物理加速度限制：最大 dv_act/dt (m/s²)
          phys_alpha_max: 12.0 # 物理角加速度限制：最大 domega_act/dt (rad/s²)
          vel_on_step: 0.8 # 台阶区域期望速度 (m/s)
          a_lat_max: 3.5 # 侧向加速度限制：|v_act*omega_act| (m/s²)
          slow_down_distance: 0.8 # 距离终点剩余弧长小于该值时开始减速 (m)
          slow_down_num_samples: 12 # 剩余弧长估计的积分采样数
          step_norm_threshold: 0.01 # 台阶方向场模长阈值：>=该值认为进入台阶区域
          step_norm_transition: 0.05 # smoothstep过渡宽度
        weights: # 权重
          q_y: 0.35 # 横向误差权重
          q_theta: 0.2 # 航向误差权重
          q_u: 1.5 # 进度项权重
          q_v_final: 0.5 # 终点减速权重
          r_v: 0.02 # 线速度正则
          r_omega: 0.02 # 角速度正则
          r_dv: 0.04 # 线速度平滑
          r_domega: 0.04 # 角速度平滑
          acc_limit: 10.0 # 指令变化率超限惩罚（dv_cmd）
          alpha_limit: 10.0 # 指令变化率超限惩罚（domega_cmd）
          phys_acc_limit: 5.0 # 物理加速度超限惩罚（dv_act）
          phys_alpha_limit: 5.0 # 物理角加速度超限惩罚（domega_act）
          lat_acc: 10.0 # 侧向稳定性惩罚（|v_act*omega_act| 超限）
          vel_on_step: 3.0 # 台阶区域速度保持权重
          obstacle: 2.0 # 避障权重（全局+局部）
          direction: 2.0 # 台阶方向对齐权重
          step: 0.01 # 经过台阶惩罚
      stop: # 停止模式
        limits: # 运动限制
          vel_max: 2.0 # 最大线速度硬约束 (m/s)
          omega_max: 7.2 # 最大角速度硬约束 (rad/s)
          omega_min: -7.2 # 最小角速度硬约束 (rad/s)
          acc_max: 2.5 # 指令变化率限制：最大 dv_cmd/dt (m/s²)
          alpha_max: 12.0 # 指令变化率限制：最大 domega_cmd/dt (rad/s²)
          phys_acc_max: 2.5 # 物理加速度限制：最大 dv_act/dt (m/s²)
          phys_alpha_max: 12.0 # 物理角加速度限制：最大 domega_act/dt (rad/s²)
          vel_on_step: 0.8 # 台阶区域期望速度 (m/s)
          a_lat_max: 3.5 # 侧向加速度限制：|v_act*omega_act| (m/s²)
        weights: # 权重
          q_v: 0.6 # 线速度正则
          q_omega: 0.6 # 角速度正则
          acc_limit: 10.0 # 指令变化率超限惩罚（dv_cmd）
          alpha_limit: 10.0 # 指令变化率超限惩罚（domega_cmd）
          phys_acc_limit: 5.0 # 物理加速度超限惩罚（dv_act）
          phys_alpha_limit: 5.0 # 物理角加速度超限惩罚（domega_act）
          lat_acc: 10.0 # 侧向稳定性惩罚（|v_act*omega_act| 超限）
          vel_on_step: 3.0 # 台阶区域速度保持权重
          obstacle: 2.0 # 避障惩罚
          obstacle_terminal: 6.0 # 终端避障惩罚（防止停在障碍上）
          direction: 2.0 # 在台阶上要求朝向与台阶方向对齐
          step_terminal: 6.0 # 终端台阶惩罚（防止停在台阶上）