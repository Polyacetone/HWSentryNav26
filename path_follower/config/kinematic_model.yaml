/**:
  ros__parameters:
    kinematic_model:
      # Smooth sign approximation epsilon used in tanh(x / sgn_eps)
      sgn_eps: 0.05

      # Longitudinal hidden-state model:
      #   x_h_dot = a11*x_h + a12*v + b1*dv
      #   v_dot   = a21*x_h + a22*v + b2*dv + cf1*tanh(v/sgn_eps) + cf2*v*abs(w)
      a11: -2.038824922035528
      a12: 7.221432774520752
      a21: -0.7604428990341731
      a22: 0.7832998687279418
      b1: -3.3610022866858458
      b2: 0.6361915561776295
      cf1: -0.002097538466019748
      cf2: -0.16715129238904564

      # Yaw channel: w_dot = (1/tau_w) * (dw - w) - cf3 * tanh(w/sgn_eps)
      tau_w: 0.062366783327019414
      cf3: 0.01871231762442719

      # Hidden-state observer: x_h_hat[k+1] = xh_pred + obs_l * (v_meas - v_pred)
      xh0: 0.11723626798212293
      obs_l: -8.06089990528086
