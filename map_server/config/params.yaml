/**:
  ros__parameters:
    debug:
      enable: true # 是否启用调试模式
      global_cloud_pub_topic: "/map_server/debug/global_map_cloud" # 全局点云发布话题名称
      accumulated_cloud_pub_topic: "/map_server/debug/accumulated_local_cloud" # 累积局部点云发布话题名称
      dynamic_points_pub_topic: "/map_server/debug/dynamic_obstacle_points" # 动态障碍物点云发布话题名称

    map_inflation: # 全局与局部统一的代价地图/方向场膨胀参数（单位：米，自动根据地图分辨率换算为像素）
      robot_radius_m: 0.1 # 膨胀平台半径（米）；障碍代价保持255，方向场非本体保持到独立 cap
      cutoff_radius_m: 0.3 # 膨胀截断半径（米），超过该距离不再膨胀
      decay_alpha: 1.2 # 指数衰减系数（像素距离语义），越大衰减越快
      direction_non_body_magnitude_cap: 0.9 # 非原始方向地形本体格的模长上限；uint8 向下量化为 229/255，本体固定为 1

    global_map:
      robot_status_sub_topic: "/serial_bridge/robot_status" # 机器人状态订阅话题，用于获取机器人颜色以选择对应的全局导航地图
      robot_color_wait_timeout: 1.0 # 等待获取机器人颜色信息的超时时间，单位秒
      blue_nav_map_filename: "test.msgpack" # 全局导航地图路径（蓝方）
      red_nav_map_filename: "test.msgpack" # 全局导航地图路径（红方）
      default_nav_map_filename: "test.msgpack" # 获取机器人颜色超时后使用此全局导航地图
      direction_map_pub_topic: "/map_server/global_direction_map" # 全局台阶方向地图发布话题名称
      cost_map_pub_topic: "/map_server/global_cost_map" # 全局代价地图发布话题名称
      cloud_filename: "test.pcd" # 全局点云路径（为空则不加载，启用仅基于局部点云的粗略避障）
      downsample_voxel_size: 0.05 # 全局点云下采样体素大小，单位m
      pub_freq: 1.0 # 全局地图发布频率，单位Hz

    local_map:
      bypass_dynamic_obstacle: false # 是否绕过动态障碍物检测（开启后发布全空的局部代价地图，用于调试）
      cloud_sub_topic: "/small_glim/registered_cloud" # 局部点云订阅话题名称，用于动态障碍物分析
      local_cost_maps_pub_topic: "/map_server/local_cost_maps" # 局部代价地图序列发布话题（maps[0]=当前帧，maps[1..N]=预测帧）
      cloud_accumulate_frames: 5 # 局部点云累积帧数
      roi_xy_radius_min: 0.4 # 局部点云ROI的xy平面半径最小值（姿态基于imu_world系（z轴竖直），平移基于pitch_link系），单位m
      roi_xy_radius_max: 6.0 # 局部点云ROI的xy平面半径最大值（姿态基于imu_world系（z轴竖直），平移基于pitch_link系），单位m
      roi_z_max: 0.2 # 局部点云ROI的z轴最大值（姿态基于imu_world系（z轴竖直），平移基于pitch_link系），单位m
      roi_z_min: -0.55 # 局部点云ROI的z轴最小值（姿态基于imu_world系（z轴竖直），平移基于pitch_link系），单位m
      downsample_voxel_size: 0.03 # 局部点云下采样体素大小，单位m
      with_global_cloud: # 有全局点云时通过比较局部点云与全局点云的最近邻距离来判断动态障碍物
        enable_prediction: true # 有全局点云时是否启用目标跟踪预测
        distance_threshold: 0.2 # 如果局部地图点与全局地图点的最近邻距离大于此阈值，认为是动态障碍物，单位m。有全局点云时使用
      without_global_cloud: # 无全局点云时采用法向量垂直z轴的特征来判断动态障碍物
        enable_prediction: false # 无全局点云时是否启用目标跟踪预测（法向量分析容易将台阶等静态结构误检为动态，轨迹预测意义不大）
        normal_num_neighbors: 12 # 法向量估计使用的K近邻数量
        vertical_normal_abs_z_max: 0.3 # |normal.z|小于该值视为法向量垂直z轴（认为是动态障碍物）
        direction_filter_threshold: 0.1 # 台阶方向场归一化模长过滤阈值 [0,1]（0.0=关闭），当无全局点云时在create_obstacle_mask中检查每个动态点对应的方向场模长（ch1, 0-255），超过此阈值则视为台阶等已知静态结构予以滤除
      sor_num_neighbors: 12 # 统计离群点过滤使用的K近邻数量
      sor_std_mul: 2.0 # SOR保留阈值=均值+sor_std_mul*标准差
      cell_obstacle_point_threshold: 3 # 如果某个栅格内的动态障碍物点数大于此阈值，则认为该栅格被动态障碍物占据
      min_obstacle_cluster_cells: 3 # 障碍物连通域最小格数（<=1 关闭）；滤除噪声散点，避免膨胀与跟踪在数百个孤立格上做无效工作
      object_tracker: # 基于目标的动态障碍物跟踪与预测参数
        morph_close_kernel_size: 5 # 形态学闭运算核大小（0或1=关闭）
        min_blob_area: 3 # 最小连通域面积（像素），滤除噪声小斑块
        local_grid_size: 50 # 局部栅格地图边长（像素）
        max_association_dist: 0.3 # 匈牙利匹配最大关联距离（m），超过则视为新目标
        process_noise_std: 4.0 # KF 过程噪声（加速度标准差，m/s²），越大越信任量测，越小越信任模型
        measurement_noise_std: 0.08 # KF 测量噪声标准差（m），对应质心观测精度
        max_lost_frames: 3 # 连续未匹配帧数上限，超过则删除航迹
        min_hits_to_confirm: 3 # 航迹连续匹配此次数后才进入运动预测；未确认障碍仍会静态保底写入未来代价图
        local_grid_decay: 0.8 # 未匹配时局部栅格衰减因子，越小形状消失越快
        local_grid_render_threshold: 0.3 # 局部栅格渲染阈值（0~1），低于此值不渲染
        prediction_steps: 20 # 未来预测步数；与 2.0 s 规划/MPC 时域及 0.1 s 预测步长对齐
        prediction_dt: 0.1 # 预测步长（s），prediction_steps × prediction_dt = 总预测时长
        prediction_velocity_decay_tau: 1.6 # 预测渲染速度指数衰减时间常数（s），越小越保守，<=0表示恒速外推
        prediction_max_speed: 2.4 # 预测渲染速度上限（m/s），抑制噪声导致的过大外推，<=0表示不限制
