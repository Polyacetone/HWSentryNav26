/**:
  ros__parameters:
    # ─── Topic 配置 ───
    global_path_sub_topic: "/global_planner/control_points"
    global_direction_map_sub_topic: "/map_server/global_direction_map"
    global_cost_map_sub_topic: "/map_server/global_cost_map"
    local_cost_map_sub_topic: "/map_server/local_cost_map"
    comp_stage_sub_topic: "/serial_bridge/comp_stage"
    chassis_status_sub_topic: "/serial_bridge/chassis_status"
    spin_cmd_sub_topic: "/decision/spin_cmd"
    chassis_cmd_sub_topic: "/mpc_controller/chassis_cmd"  # mpc_controller 实际命令速度反馈
    local_plan_pub_topic: "/local_planner/local_plan"
    planner_state_pub_topic: "/local_planner/state"

    debug:
      enable: true                         # 是否启用 local_planner 调试可视化与性能日志
      best_path_pub_topic: "/local_planner/debug/best_path"
      rollouts_pub_topic: "/local_planner/debug/rollouts"
      final_cost_map_pub_topic: "/local_planner/debug/final_cost_map"
      max_rollouts: 24                    # 最多发布多少条 rollout 供 RViz 观察

    misc:
      stop_threshold_dist: 0.5
      stop_threshold_u: 0.99
      control_dt: 0.05

    # ─── 台阶路径掩码参数 ───
    step_mask:
      path_align_dot_threshold: 0.6
      full_effect_radius: 0.4
      cutoff_radius: 0.8
      length_num_samples: 100

    # ─── 台阶前瞻标志位 ───
    step_ahead_flag:
      detect_norm_threshold: 0.6
      detect_dot_threshold: 0.5
      on_count_threshold: 2
      off_count_threshold: 2

    # ─── 状态机参数 ───
    state_machine:
      follow_to_spin_vel_max: 0.2
      spin_to_follow_omega_max: 0.6
      to_idle_vel_max: 0.2
      to_idle_omega_max: 0.6
      stopping_timeout: 1.0

    # ─── 恢复/脱困参数 ───
    recovery:
      stuck:
        enable: true
        cmd_vel_threshold: 0.3        # 被视为"在发命令"的速度下界
        timeout: 2.0                  # 持续发命令但不动超过此时间视为卡死（秒）
        max_displacement: 0.3         # 卡死判定期间的最大允许位移（米）
        reverse_speed: 0.5            # 倒车速度（m/s）
        reverse_duration: 1.0         # 倒车持续时间（秒）
      hazard:
        search_radius_min: 0.5        # recovery goal 搜索最小半径（米）
        search_radius_max: 3.0        # recovery goal 搜索最大半径（米）
        safe_threshold: 10.0          # 代价图中代价低于此阈值视为安全（0~255）
        hazard_cost_threshold: 50.0   # 代价图中代价高于此阈值视为处于障碍物中（触发 hazard）
        safe_hold_time: 0.3           # 连续处于安全区域多久后退出 hazard recovery（秒）
        goal_score:
          cost_weight: 1.0
          distance_weight: 30.0
          forward_reward_weight: 50.0

    # ─── MPPI 局部轨迹采样参数 ───
    mppi:
      num_rollouts: 1024               # 采样轨迹数量 K
      horizon: 40                     # 预测步数 T
      dt: 0.05                        # 时间步长（秒），与 MPC_DT 一致
      num_iterations: 2               # MPPI 迭代次数（每次 plan() 内重复采样+更新）
      num_threads: 4                  # OMP 并行线程数
      # 5 状态简化模型延迟系数（来自 mpc_controller 灰盒模型辨识）
      Av: 0.905                       # v 通道一阶滞后 ZOH 系数
      A22: 0.554                      # ω 通道 ZOH 系数
      A24: 0.446                      # ω 通道 ZOH 输入系数
      # 控制量上下限
      v_cmd_max: 2.0                  # 最大前进速度（m/s）
      v_cmd_min: 0.0                 # 最大后退速度（m/s）
      omega_cmd_max: 7.2              # 最大角速度（rad/s）
      omega_cmd_min: -7.2             # 最小角速度（rad/s）
      # 采样噪声标准差
      noise_sigma_v: 0.5              # v_cmd 采样噪声
      noise_sigma_omega: 1.0          # ω_cmd 采样噪声
      # MPPI 温度参数（越小越贪心）
      temperature: 0.1
      # 代价函数权重
      w_obstacle: 1.0                 # 障碍物代价权重
      w_path_follow: 5.0              # 路径跟随代价权重（横向偏差）
      w_heading: 1.0                  # 朝向对齐代价权重
      w_progress: 5.0                 # 沿路径前进进度代价权重
      w_direction: 3.0                # 台阶方向对齐代价权重
      w_control_v: 0.1                # 速度控制量平滑代价权重
      w_control_omega: 0.05           # 角速度控制量平滑代价权重
      w_terminal_goal: 3.0            # 终端代价权重（到路径参考点距离）
      w_control_dv: 0.5               # 速度变化率平滑代价权重
      w_control_domega: 0.2           # 角速度变化率平滑代价权重
      # 台阶方向场阈值
      step_norm_threshold: 0.6        # 方向场模长大于此阈值视为台阶区域
      # 路径投影参数（MPPI 内部）
      proj_num_samples: 50
      proj_search_window: 0.15
      proj_lazy_dist: 0.1
      # 障碍物代价阈值
      obstacle_threshold: 200.0       # 代价图中代价高于此视为不可通行（0~255）
      collision_cost: 1000.0          # 碰撞额外惩罚代价
      # 控制序列平滑参数
      smooth_alpha: 0.15              # 时间维指数平滑系数（0=不平滑, 1=完全平滑）
